          - region [ref=f2e946]:
            - generic [ref=f2e947]:
              - heading "Technical details" [level=2] [ref=f2e948]
              - generic [ref=f2e949]:
                - link "edit":
                  - /url: /w/index.php?title=Node.js&action=edit&section=7
            - paragraph [ref=f2e950]:
              - text: Node.js is a JavaScript runtime environment that processes incoming requests in a loop, called the
              - link "event loop" [ref=f2e951] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Event_loop
              - text: .
            - region [ref=f2e952]:
              - generic [ref=f2e953]:
                - heading "Internals" [level=3] [ref=f2e954]
                - generic [ref=f2e955]:
                  - link "edit":
                    - /url: /w/index.php?title=Node.js&action=edit&section=8
              - paragraph [ref=f2e956]:
                - text: Node.js uses
                - link "libuv" [ref=f2e957] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Libuv
                - text: under the hood to handle asynchronous events. Libuv is an abstraction layer for network and file system functionality on both Windows and
                - link "POSIX" [ref=f2e958] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/POSIX
                - text: "-based systems such as Linux,"
                - link "macOS" [ref=f2e959] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/MacOS
                - text: ", OSS on"
                - link "NonStop" [ref=f2e960] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/NonStop_(server_computers)
                - text: ", and Unix. Node.js relies on nghttp2 for HTTP support. As of version 20, Node.js uses the ada library which provides up-to-date"
                - link "WHATWG" [ref=f2e961] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/WHATWG
                - link "URL" [ref=f2e962] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/URL
                - text: compliance. As of version 19.5, Node.js uses the simdutf library for fast Unicode validation and transcoding. As of version 21.3, Node.js uses the simdjson library for fast JSON parsing.
            - region [ref=f2e963]:
              - generic [ref=f2e964]:
                - heading "Threading" [level=3] [ref=f2e965]
                - generic [ref=f2e966]:
                  - link "edit":
                    - /url: /w/index.php?title=Node.js&action=edit&section=9
              - paragraph [ref=f2e967]:
                - text: Node.js operates on a
                - link "single-thread" [ref=f2e968] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Single_threading
                - link "event loop" [ref=f2e969] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Event_loop
                - text: ", using"
                - link "non-blocking I/O" [ref=f2e970] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Non-blocking_I/O
                - text: calls, allowing it to support tens of thousands of concurrent connections without incurring the cost of thread
                - link "context switching" [ref=f2e971] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Context_switch
                - text: .
                - superscript [ref=f2e972]:
                  - link "[57]" [ref=f2e973] [cursor=pointer]:
                    - /url: "#cite_note-57"
                - text: The design of sharing a single thread among all the requests that use the
                - link "observer pattern" [ref=f2e975] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Observer_pattern
                - text: is intended for building highly concurrent applications, where any function performing I/O must use a
                - link "callback" [ref=f2e976] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Callback_(computer_programming)
                - text: . To accommodate the single-threaded event loop, Node.js uses the
                - link "libuv" [ref=f2e977] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Libuv
                - text: library—which, in turn, uses a fixed-sized thread pool that handles some of the non-blocking asynchronous I/O operations.
                - superscript [ref=f2e978]:
                  - link "[8]" [ref=f2e979] [cursor=pointer]:
                    - /url: "#cite_note-readwrite-8"
              - paragraph [ref=f2e981]: A thread pool handles the execution of parallel tasks in Node.js. The main thread function call posts tasks to the shared task queue, which threads in the thread pool pull and execute. Inherently non-blocking system functions such as networking translate to kernel-side non-blocking sockets, while inherently blocking system functions such as file I/O run in a blocking way on their own threads. When a thread in the thread pool completes a task, it informs the main thread of this, which in turn, wakes up and executes the registered callback.
              - paragraph [ref=f2e982]:
                - text: A downside of this single-threaded approach is that Node.js does not allow
                - link "vertical scaling" [ref=f2e983] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Vertical_scaling
                - text: by increasing the number of
                - link "CPU cores" [ref=f2e984] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/CPU_core
                - text: of the machine it is running on without using an additional module, such as cluster,
                - superscript [ref=f2e985]:
                  - link "[58]" [ref=f2e986] [cursor=pointer]:
                    - /url: "#cite_note-node_cluster_module_doc-58"
                - text: StrongLoop Process Manager,
                - superscript [ref=f2e988]:
                  - link "[59]" [ref=f2e989] [cursor=pointer]:
                    - /url: "#cite_note-59"
                - text: or pm2.
                - superscript [ref=f2e991]:
                  - link "[60]" [ref=f2e992] [cursor=pointer]:
                    - /url: "#cite_note-60"
                - text: However, developers can increase the default number of threads in the libuv thread pool. The server
                - link "operating system (OS)" [ref=f2e994] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Operating_system
                - text: is likely to distribute these threads across multiple cores.
                - superscript [ref=f2e995]:
                  - link "[61]" [ref=f2e996] [cursor=pointer]:
                    - /url: "#cite_note-61"
                - text: Another problem is that long-lasting computations and other CPU-bound tasks freeze the entire event-loop until completion.
                - superscript [ref=f2e998]:
                  - text: "["
                  - link "citation needed" [ref=f2e1000] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                  - text: "]"
            - region [ref=f2e1001]:
              - generic [ref=f2e1002]:
                - heading "V8" [level=3] [ref=f2e1003]
                - generic [ref=f2e1004]:
                  - link "edit":
                    - /url: /w/index.php?title=Node.js&action=edit&section=10
              - note [ref=f2e1005]:
                - text: "Main article:"
                - link "V8 (JavaScript engine)" [ref=f2e1006] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/V8_(JavaScript_engine)
              - paragraph [ref=f2e1007]:
                - text: V8 is the JavaScript execution engine which was initially built for
                - link "Google Chrome" [ref=f2e1008] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Google_Chrome
                - text: . It was then open-sourced by Google in 2008. Written in
                - link "C++" [ref=f2e1009] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/C++
                - text: ", V8 compiles JavaScript source code to native machine code"
                - link "at runtime" [ref=f2e1010] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Just-in-time_compilation
                - text: .
                - superscript [ref=f2e1011]:
                  - link "[8]" [ref=f2e1012] [cursor=pointer]:
                    - /url: "#cite_note-readwrite-8"
                - text: As of 2016, it also includes Ignition, a
                - link "bytecode interpreter" [ref=f2e1014] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Bytecode_interpreter
                - text: .
            - region [ref=f2e1015]:
              - generic [ref=f2e1016]:
                - heading "Package management" [level=3] [ref=f2e1017]
                - generic [ref=f2e1018]:
                  - link "edit":
                    - /url: /w/index.php?title=Node.js&action=edit&section=11
              - paragraph [ref=f2e1019]:
                - link "npm" [ref=f2e1020] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Npm_(software)
                - text: is the pre-installed package manager for the Node.js server platform. It installs Node.js programs from the npm registry, organizing the installation and management of third-party Node.js programs.
            - region [ref=f2e1021]:
              - generic [ref=f2e1022]:
                - heading "Event loop" [level=3] [ref=f2e1023]
                - generic [ref=f2e1024]:
                  - link "edit":
                    - /url: /w/index.php?title=Node.js&action=edit&section=12
              - paragraph [ref=f2e1025]:
                - text: Node.js registers with the operating system so the OS notifies it of
                - link "asynchronous I/O" [ref=f2e1026] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Asynchronous_I/O
                - text: events such as new connections. Within the Node.js runtime, events trigger callbacks and each connection is handled as a small
                - link "heap allocation" [ref=f2e1027] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Heap_allocation
                - text: . Traditionally, relatively heavyweight OS processes or threads handled each connection. Node.js uses an event loop for concurrent I/O, instead of processes or threads.
                - superscript [ref=f2e1028]:
                  - link "[62]" [ref=f2e1029] [cursor=pointer]:
                    - /url: "#cite_note-62"
                - text: In contrast to other event-driven servers,
                - superscript [ref=f2e1031]:
                  - text: "["
                  - link "which?" [ref=f2e1033] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Wikipedia:Avoid_weasel_words
                  - text: "]"
                - text: Node.js's event loop does not need to be called explicitly. Instead, callbacks are defined, and the server automatically enters the event loop at the end of the callback definition. Node.js exits the event loop when there are no further callbacks to be performed.
            - region [ref=f2e1034]:
              - generic [ref=f2e1035]:
                - heading "WebAssembly" [level=3] [ref=f2e1036]
                - generic [ref=f2e1037]:
                  - link "edit":
                    - /url: /w/index.php?title=Node.js&action=edit&section=13
              - paragraph [ref=f2e1038]:
                - text: Node.js supports
                - link "WebAssembly" [ref=f2e1039] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/WebAssembly
                - text: and as of Node 14 has experimental support of
                - link "WASI" [ref=f2e1040] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/WebAssembly#WASI
                - text: ", the WebAssembly System Interface."
            - region [ref=f2e1041]:
              - generic [ref=f2e1042]:
                - heading "Native bindings" [level=3] [ref=f2e1043]
                - generic [ref=f2e1044]:
                  - link "edit":
                    - /url: /w/index.php?title=Node.js&action=edit&section=14
              - note [ref=f2e1045]:
                - text: "See also:"
                - link "Foreign function interface" [ref=f2e1046] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Foreign_function_interface
              - paragraph [ref=f2e1047]:
                - text: Node.js provides a way to create "add-ons" via a
                - link "C" [ref=f2e1048] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/C_(programming_language)
                - text: "-based API called N-API, which can be used to produce loadable (importable)"
                - code [ref=f2e1049]: .node
                - text: modules from source code written in C/C++.
                - superscript [ref=f2e1050]:
                  - link "[63]" [ref=f2e1051] [cursor=pointer]:
                    - /url: "#cite_note-:1-63"
                - text: The modules can be directly loaded into memory and executed from within JS environment as simple CommonJS modules. The implementation of the N-API relies on internal C/C++ Node.js and V8 objects requiring users
                - link "to import" [ref=f2e1053] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Language_binding
                - text: (
                - link "#include" [ref=f2e1054] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Include_directive
                - text: ) Node.js specific
                - link "headers" [ref=f2e1055] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Include_directive
                - text: into their native source code.
                - superscript [ref=f2e1056]:
                  - link "[63]" [ref=f2e1057] [cursor=pointer]:
                    - /url: "#cite_note-:1-63"
              - paragraph [ref=f2e1059]: As the Node.js API is subject to breaking changes at a binary level, modules have to be built and shipped against specific Node.js versions to work properly. To address the issue, third parties have introduced open-sourced С/С++ wrappers on top of the API that partially alleviate the problem. They simplify interfaces, but as a side effect they may also introduce complexity which maintainers have to deal with. Even though the core functionality of Node.js resides in a JavaScript built-in library, modules written in C++ can be used to enhance capabilities and to improve performance of applications.
              - paragraph [ref=f2e1060]:
                - text: In order to produce such modules one needs to have an appropriate C++ compiler and necessary headers (the latter are typically shipped with Node.js itself), e.g.,
                - link "gcc" [ref=f2e1061] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/GNU_Compiler_Collection
                - text: ","
                - link "clang" [ref=f2e1062] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Clang
                - text: or
                - link "MSVC++" [ref=f2e1063] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Microsoft_Visual_C++
                - text: .
              - paragraph [ref=f2e1064]:
                - text: The N-API is similar to
                - link "Java Native Interface" [ref=f2e1065] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Java_Native_Interface
                - text: .
                - link "OpenHarmony" [ref=f2e1066] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/OpenHarmony
                - text: and
                - link "ArkTS" [ref=f2e1067] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/ArkTS
                - text: also adopts N-API, with the internal implementation rewritten.
                - superscript [ref=f2e1068]:
                  - link "[64]" [ref=f2e1069] [cursor=pointer]:
                    - /url: "#cite_note-mineharmony-64"
          - region [ref=f2e1071]:
            - generic [ref=f2e1072]:
              - heading "Project governance" [level=2] [ref=f2e1073]
              - generic [ref=f2e1074]:
                - link "edit":
                  - /url: /w/index.php?title=Node.js&action=edit&section=15
            - note [ref=f2e1075]:
              - text: "Main article:"
              - link "OpenJS Foundation" [ref=f2e1076] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/OpenJS_Foundation
            - paragraph [ref=f2e1077]:
              - text: In 2015, various branches of the greater Node.js community began working under the vendor-neutral Node.js Foundation. The stated purpose of the organization "is to enable widespread adoption and help accelerate development of Node.js and other related modules through an open governance model that encourages participation, technical contribution, and a framework for long-term stewardship by an ecosystem invested in Node.js' success."
              - superscript [ref=f2e1078]:
                - link "[65]" [ref=f2e1079] [cursor=pointer]:
                  - /url: "#cite_note-65"
            - paragraph [ref=f2e1081]:
              - text: The Node.js Foundation Technical Steering Committee (TSC) is the technical governing body of the Node.js Foundation. The TSC is responsible for the core Node.js repo as well as dependent and adjacent projects. Generally the TSC delegates the administration of these projects to working groups or committees.
              - superscript [ref=f2e1082]:
                - link "[66]" [ref=f2e1083] [cursor=pointer]:
                  - /url: "#cite_note-66"
              - text: The LTS group that manages long term supported releases is one such group. Other current groups include Website, Streams, Build, Diagnostics, i18n, Evangelism, Docker, Addon API, Benchmarking, Post-mortem, Intl, Documentation, and Testing.
              - superscript [ref=f2e1085]:
                - link "[67]" [ref=f2e1086] [cursor=pointer]:
                  - /url: "#cite_note-67"
            - paragraph [ref=f2e1088]:
              - text: In August 2017, a third of the TSC members resigned due to a dispute related to the project's code of conduct. They resigned after a vote failed to remove a member from the leadership group against whom multiple complaints had been filed.
              - superscript [ref=f2e1089]:
                - link "[68]" [ref=f2e1090] [cursor=pointer]:
                  - /url: "#cite_note-68"
            - table [ref=f2e1092]:
