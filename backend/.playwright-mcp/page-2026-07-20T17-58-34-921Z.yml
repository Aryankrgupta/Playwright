            - paragraph [ref=f2e311]:
              - text: Node.js is a
              - link "cross-platform" [ref=f2e312] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Cross-platform
              - text: ","
              - link "open-source" [ref=f2e313] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Open-source_software
              - link "JavaScript" [ref=f2e314] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/JavaScript
              - link "runtime environment" [ref=f2e315] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Runtime_environment
              - text: that can run on
              - link "Windows" [ref=f2e316] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Microsoft_Windows
              - text: ","
              - link "Linux" [ref=f2e317] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Linux
              - text: ","
              - link "Unix" [ref=f2e318] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Unix
              - text: ","
              - link "macOS" [ref=f2e319] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/MacOS
              - text: ", and more. Node.js runs on the"
              - link "V8" [ref=f2e320] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/V8_(JavaScript_engine)
              - link "JavaScript engine" [ref=f2e321] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/JavaScript_engine
              - text: ", and executes JavaScript code outside a"
              - link "web browser" [ref=f2e322] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Web_browser
              - text: . According to the Stack Overflow Developer Survey, Node.js is one of the most commonly used web technologies.
              - superscript [ref=f2e323]:
                - link "[6]" [ref=f2e324] [cursor=pointer]:
                  - /url: "#cite_note-6"
            - paragraph [ref=f2e326]:
              - text: Node.js allows developers to use JavaScript for writing
              - link "command line tools" [ref=f2e327] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Command-line_interface
              - text: and
              - link "server-side scripting" [ref=f2e328] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Server-side_scripting
              - text: . Running Javascript on the server is commonly used to generate
              - link "dynamic web page" [ref=f2e329] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Dynamic_web_page
              - text: content before the page is sent to the user's web browser. Consequently, Node.js represents a "JavaScript everywhere"
              - link "paradigm" [ref=f2e330] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Paradigm
              - text: ","
              - superscript [ref=f2e331]:
                - link "[7]" [ref=f2e332] [cursor=pointer]:
                  - /url: "#cite_note-7"
              - text: unifying
              - link "web-application" [ref=f2e334] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Web_application
              - text: development around a single
              - link "programming language" [ref=f2e335] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Programming_language
              - text: ", as opposed to using different languages for the server- versus client-side programming."
            - paragraph [ref=f2e336]:
              - text: Node.js has an
              - link "event-driven architecture" [ref=f2e337] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Event-driven_architecture
              - text: capable of
              - link "asynchronous I/O" [ref=f2e338] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Asynchronous_I/O
              - text: . These design choices aim to optimize
              - link "throughput" [ref=f2e339] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Throughput
              - text: and
              - link "scalability" [ref=f2e340] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Scalability
              - text: in web applications with many input/output operations, as well as for
              - link "real-time Web" [ref=f2e341] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Real-time_Web
              - text: applications (e.g.,
              - link "real-time communication" [ref=f2e342] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Real-time_communication
              - text: programs and
              - link "browser games" [ref=f2e343] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Browser_game
              - text: ).
              - superscript [ref=f2e344]:
                - link "[8]" [ref=f2e345] [cursor=pointer]:
                  - /url: "#cite_note-readwrite-8"
            - paragraph [ref=f2e347]:
              - text: The Node.js
              - link "distributed development" [ref=f2e348] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Distributed_development
              - text: project was previously governed by the Node.js Foundation,
              - superscript [ref=f2e349]:
                - link "[9]" [ref=f2e350] [cursor=pointer]:
                  - /url: "#cite_note-9"
              - text: and has now merged with the
              - link "JS Foundation" [ref=f2e352] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/JS_Foundation
              - text: to form the
              - link "OpenJS Foundation" [ref=f2e353] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/OpenJS_Foundation
              - text: . OpenJS Foundation is facilitated by the
              - link "Linux Foundation" [ref=f2e354] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Linux_Foundation
              - text: "'s Collaborative Projects program."
              - superscript [ref=f2e355]:
                - link "[10]" [ref=f2e356] [cursor=pointer]:
                  - /url: "#cite_note-10"
          - region [ref=f2e358]:
            - generic [ref=f2e359]:
              - heading "History" [level=2] [ref=f2e360]
              - generic [ref=f2e361]:
                - link "edit":
                  - /url: /w/index.php?title=Node.js&action=edit&section=1
            - figure "Ryan Dahl, creator of Node.js, in 2010" [ref=f2e362]:
              - link [ref=f2e363] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:Ryan_Dahl.jpg
            - figure "Rocket Turtle, the official mascot of Node.js since February 2024" [ref=f2e365]:
              - link [ref=f2e366] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:Node.JS_Mascot.svg
            - paragraph [ref=f2e369]:
              - text: Node.js was initially written by
              - link "Ryan Dahl" [ref=f2e370] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Ryan_Dahl
              - text: in 2009,
              - superscript [ref=f2e371]:
                - link "[11]" [ref=f2e372] [cursor=pointer]:
                  - /url: "#cite_note-training.com-11"
              - text: about 13 years after the introduction of the first server-side JavaScript environment,
              - link "Netscape" [ref=f2e374] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Netscape
              - text: "'s LiveWire Pro Web."
              - superscript [ref=f2e375]:
                - link "[12]" [ref=f2e376] [cursor=pointer]:
                  - /url: "#cite_note-12"
              - text: The initial release supported only Linux and Mac OS X. Its development and maintenance was led by Dahl and later sponsored by
              - link "Joyent" [ref=f2e378] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Joyent
              - text: .
              - superscript [ref=f2e379]:
                - link "[13]" [ref=f2e380] [cursor=pointer]:
                  - /url: "#cite_note-Google_Groups_post_by_Ryan_Dahl_about_Joyent-13"
            - paragraph [ref=f2e382]:
              - text: Dahl criticized the limited capability of
              - link "Apache HTTP Server" [ref=f2e383] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Apache_HTTP_Server
              - text: to handle many (10,000+) concurrent connections, as well as the dominant programming paradigm of sequential programming, in which applications could block entire processes or cause the creation of multiple execution stacks for simultaneous connections.
              - superscript [ref=f2e384]:
                - text: "["
                - link "citation needed" [ref=f2e386] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                - text: "]"
            - paragraph [ref=f2e387]:
              - text: Dahl demonstrated the project at the inaugural European JSConf on November 8, 2009.
              - superscript [ref=f2e388]:
                - link "[14]" [ref=f2e389] [cursor=pointer]:
                  - /url: "#cite_note-b3-14"
              - superscript [ref=f2e391]:
                - link "[15]" [ref=f2e392] [cursor=pointer]:
                  - /url: "#cite_note-15"
              - superscript [ref=f2e394]:
                - link "[16]" [ref=f2e395] [cursor=pointer]:
                  - /url: "#cite_note-16"
              - text: Node.js combined
              - link "Google" [ref=f2e397] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Google
              - text: "'s"
              - link "V8" [ref=f2e398] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/V8_(JavaScript_engine)
              - text: JavaScript engine, an
              - link "event loop" [ref=f2e399] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Event_loop
              - text: ", and a low-level"
              - link "I/O" [ref=f2e400] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Input/output
              - link "API" [ref=f2e401] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/API
              - text: .
              - superscript [ref=f2e402]:
                - link "[17]" [ref=f2e403] [cursor=pointer]:
                  - /url: "#cite_note-b1-17"
            - paragraph [ref=f2e405]:
              - text: In January 2010, a
              - link "package manager" [ref=f2e406] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Package_manager
              - text: was introduced for the Node.js environment called
              - link "npm" [ref=f2e407] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Npm_(software)
              - text: .
              - superscript [ref=f2e408]:
                - link "[18]" [ref=f2e409] [cursor=pointer]:
                  - /url: "#cite_note-18"
              - text: The package manager allows programmers to publish and share Node.js
              - link "packages" [ref=f2e411] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Package_manager
              - text: ", along with the accompanying source code, and is designed to simplify the installation, update and uninstallation of packages."
              - superscript [ref=f2e412]:
                - link "[17]" [ref=f2e413] [cursor=pointer]:
                  - /url: "#cite_note-b1-17"
            - paragraph [ref=f2e415]:
              - text: In June 2011, Microsoft and Joyent implemented a native
              - link "Windows" [ref=f2e416] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Microsoft_Windows
              - text: version of Node.js.
              - superscript [ref=f2e417]:
                - link "[19]" [ref=f2e418] [cursor=pointer]:
                  - /url: "#cite_note-19"
              - text: The first Node.js build supporting Windows was released in July 2011.
            - paragraph [ref=f2e420]:
              - text: In January 2012, Dahl yielded management of the project to npm creator Isaac Schlueter.
              - superscript [ref=f2e421]:
                - link "[20]" [ref=f2e422] [cursor=pointer]:
                  - /url: "#cite_note-20"
              - text: In January 2014, Schlueter announced that Timothy J. Fontaine would lead the project.
              - superscript [ref=f2e424]:
                - link "[21]" [ref=f2e425] [cursor=pointer]:
                  - /url: "#cite_note-21"
            - paragraph [ref=f2e427]:
              - text: In December 2014, Fedor Indutny created io.js, a
              - link "fork" [ref=f2e428] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Fork_(software_development)
              - text: of Node.js created because of dissatisfaction with Joyent's governance as an
              - link "open-governance" [ref=f2e429] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Open_governance
              - text: alternative with a separate technical committee. The goal was to enable a structure that would be more receptive to community input, including the updating of io.js with the latest Google V8 JavaScript engine releases, diverging from Node.js's approach at that time.
              - superscript [ref=f2e430]:
                - link "[22]" [ref=f2e431] [cursor=pointer]:
                  - /url: "#cite_note-iwtw-22"
            - paragraph [ref=f2e433]:
              - text: The Node.js Foundation, formed to reconcile Node.js and io.js under a unified banner, was announced in February 2015.
              - superscript [ref=f2e434]:
                - link "[23]" [ref=f2e435] [cursor=pointer]:
                  - /url: "#cite_note-23"
              - text: The merger was realized in September 2015 with Node.js v0.12 and io.js v3.3 combining into Node v4.0.
              - superscript [ref=f2e437]:
                - link "[24]" [ref=f2e438] [cursor=pointer]:
                  - /url: "#cite_note-24"
              - text: This merge brought V8
              - link "ES6" [ref=f2e440] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/ECMAScript#ES2015
              - text: features into Node.js and started a long-term support release cycle.
              - superscript [ref=f2e441]:
                - link "[25]" [ref=f2e442] [cursor=pointer]:
                  - /url: "#cite_note-25"
              - text: By 2016, the io.js website recommended returning to Node.js and announced no further io.js releases, effectively ending the fork and solidifying the merger's success.
              - superscript [ref=f2e444]:
                - link "[26]" [ref=f2e445] [cursor=pointer]:
                  - /url: "#cite_note-26"
            - paragraph [ref=f2e447]:
              - text: In 2019, the JS Foundation and Node.js Foundation merged to form the
              - link "OpenJS Foundation" [ref=f2e448] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/OpenJS_Foundation
              - text: .
            - region [ref=f2e449]:
              - generic [ref=f2e450]:
                - heading "Branding" [level=3] [ref=f2e451]
                - generic [ref=f2e452]:
                  - link "edit":
                    - /url: /w/index.php?title=Node.js&action=edit&section=2
              - paragraph [ref=f2e453]:
                - text: The Node.js logo features a green hexagon with overlapping bands to represent the cross-platform nature of the runtime.
                - superscript [ref=f2e454]:
                  - link "[27]" [ref=f2e455] [cursor=pointer]:
                    - /url: "#cite_note-27"
                - text: The Rocket Turtle was chosen as the official Node.js mascot in February 2024 following a design contest.
                - superscript [ref=f2e457]:
                  - link "[28]" [ref=f2e458] [cursor=pointer]:
                    - /url: "#cite_note-28"
          - region [ref=f2e460]:
            - generic [ref=f2e461]:
              - heading "Overview" [level=2] [ref=f2e462]
              - generic [ref=f2e463]:
                - link "edit":
                  - /url: /w/index.php?title=Node.js&action=edit&section=3
            - paragraph [ref=f2e464]:
              - text: Node.js allows the creation of
              - link "web servers" [ref=f2e465] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Web_server
              - text: and networking tools using
              - link "JavaScript" [ref=f2e466] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/JavaScript
              - text: and a collection of "modules" that handle various core functionalities.
              - superscript [ref=f2e467]:
                - link "[14]" [ref=f2e468] [cursor=pointer]:
                  - /url: "#cite_note-b3-14"
              - superscript [ref=f2e470]:
                - link "[17]" [ref=f2e471] [cursor=pointer]:
                  - /url: "#cite_note-b1-17"
              - superscript [ref=f2e473]:
                - link "[29]" [ref=f2e474] [cursor=pointer]:
                  - /url: "#cite_note-b2-29"
              - superscript [ref=f2e476]:
                - link "[30]" [ref=f2e477] [cursor=pointer]:
                  - /url: "#cite_note-b4-30"
              - superscript [ref=f2e479]:
                - link "[31]" [ref=f2e480] [cursor=pointer]:
                  - /url: "#cite_note-b5-31"
              - superscript [ref=f2e482]:
                - text: "["
                - link "excessive citations" [ref=f2e484] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Wikipedia:Citing_sources#Bundling_citations
                - text: "]"
              - text: Modules are provided for
              - link "file system" [ref=f2e485] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File_system
              - text: I/O, networking (
              - link "DNS" [ref=f2e486] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Domain_Name_System
              - text: ","
              - link "HTTP" [ref=f2e487] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/HTTP
              - text: ","
              - link "TCP" [ref=f2e488] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Transmission_Control_Protocol
              - text: ","
              - link "TLS/SSL" [ref=f2e489] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Transport_Layer_Security
              - text: or
              - link "UDP" [ref=f2e490] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/User_Datagram_Protocol
              - text: ),
              - link "binary" [ref=f2e491] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Binary_file
              - text: data (buffers),
              - link "cryptography" [ref=f2e492] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Cryptography
              - text: functions,
              - link "data streams" [ref=f2e493] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Stream_(computing)
              - text: and other core functions.
              - superscript [ref=f2e494]:
                - link "[17]" [ref=f2e495] [cursor=pointer]:
                  - /url: "#cite_note-b1-17"
              - superscript [ref=f2e497]:
                - link "[30]" [ref=f2e498] [cursor=pointer]:
                  - /url: "#cite_note-b4-30"
              - superscript [ref=f2e500]:
                - link "[32]" [ref=f2e501] [cursor=pointer]:
                  - /url: "#cite_note-32"
              - text: Node.js's modules use an API designed to reduce the complexity of writing server applications.
              - superscript [ref=f2e503]:
                - link "[17]" [ref=f2e504] [cursor=pointer]:
                  - /url: "#cite_note-b1-17"
              - superscript [ref=f2e506]:
                - link "[30]" [ref=f2e507] [cursor=pointer]:
                  - /url: "#cite_note-b4-30"
            - paragraph [ref=f2e509]:
              - text: Since version 22.6.0, Node.js natively supports both
              - link "JavaScript" [ref=f2e510] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/JavaScript
              - text: and
              - link "TypeScript" [ref=f2e511] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/TypeScript
              - text: ", allowing TypeScript files to be executed without a separate compilation step."
              - superscript [ref=f2e512]:
                - link "[33]" [ref=f2e513] [cursor=pointer]:
                  - /url: "#cite_note-33"
              - text: The TypeScript support was contributed by Node.js TSC member Marco Ippolito. In addition, many
              - link "compile-to-JS" [ref=f2e515] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Source-to-source_compiler
              - text: languages are available,
              - superscript [ref=f2e516]:
                - link "[34]" [ref=f2e517] [cursor=pointer]:
                  - /url: "#cite_note-34"
              - text: allowing Node.js applications to also be written in
              - link "CoffeeScript" [ref=f2e519] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/CoffeeScript
              - text: ","
              - superscript [ref=f2e520]:
                - link "[35]" [ref=f2e521] [cursor=pointer]:
                  - /url: "#cite_note-b6-35"
              - link "Dart" [ref=f2e523] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Dart_(programming_language)
              - text: ","
              - link "ClojureScript" [ref=f2e524] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/ClojureScript
              - text: ", and others."
            - paragraph [ref=f2e525]:
              - text: Node.js is primarily used to build network programs such as web servers.
              - superscript [ref=f2e526]:
                - link "[29]" [ref=f2e527] [cursor=pointer]:
                  - /url: "#cite_note-b2-29"
              - text: The most significant difference between Node.js and
              - link "PHP" [ref=f2e529] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/PHP
              - text: is that most functions in PHP
              - link "block" [ref=f2e530] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Asynchronous_I/O
              - text: until completion (commands execute only after previous commands finish), while Node.js functions are
              - link "non-blocking" [ref=f2e531] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Asynchronous_I/O
              - text: (commands execute
              - link "concurrently" [ref=f2e532] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Concurrent_computing
              - text: and use
              - link "callbacks" [ref=f2e533] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Callback_(computer_programming)
              - text: to signal completion or failure).
              - superscript [ref=f2e534]:
                - link "[29]" [ref=f2e535] [cursor=pointer]:
                  - /url: "#cite_note-b2-29"
            - paragraph [ref=f2e537]:
              - text: Node.js is officially supported by
              - link "Linux" [ref=f2e538] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Linux
              - text: ","
              - link "macOS" [ref=f2e540] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/MacOS
              - text: and
              - link "Microsoft Windows" [ref=f2e541] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Microsoft_Windows
              - text: 8.1 and Server 2012 (and later),
              - superscript [ref=f2e542]:
                - link "[3]" [ref=f2e543] [cursor=pointer]:
                  - /url: "#cite_note-supportedOS-3"
              - text: with Tier 2 support for
              - link "SmartOS" [ref=f2e545] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/SmartOS
              - text: and
              - link "IBM AIX" [ref=f2e546] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/IBM_AIX
              - text: and experimental support for
              - link "FreeBSD" [ref=f2e547] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/FreeBSD
              - text: .
              - link "OpenBSD" [ref=f2e548] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/OpenBSD
              - text: also works, and LTS versions are available for
              - link "IBM i" [ref=f2e549] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/IBM_i
              - text: (AS/400).
              - superscript [ref=f2e550]:
                - link "[36]" [ref=f2e551] [cursor=pointer]:
                  - /url: "#cite_note-36"
              - text: The source code may also be built on similar operating systems that are not officially supported, such as
              - link "NonStop OS" [ref=f2e553] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/NonStop_OS
              - superscript [ref=f2e554]:
                - link "[37]" [ref=f2e555] [cursor=pointer]:
                  - /url: "#cite_note-bomBora_-_Node.js_for_NonStop-37"
              - text: and
              - link "Unix" [ref=f2e557] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Unix
              - text: servers.
            - region [ref=f2e558]:
              - generic [ref=f2e559]:
                - heading "Platform architecture" [level=3] [ref=f2e560]
                - generic [ref=f2e561]:
                  - link "edit":
                    - /url: /w/index.php?title=Node.js&action=edit&section=4
              - paragraph [ref=f2e562]:
                - text: Node.js enables development of fast web servers in JavaScript using
                - link "event-driven programming" [ref=f2e563] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Event-driven_programming
                - text: .
                - superscript [ref=f2e564]:
                  - link "[17]" [ref=f2e565] [cursor=pointer]:
                    - /url: "#cite_note-b1-17"
                - text: Developers can create scalable servers without using
                - link "threading" [ref=f2e567] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Thread_(computing)
                - text: by using a simplified model that uses
                - link "callbacks" [ref=f2e568] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Callback_(computer_programming)
                - text: to signal the completion of a task.
                - superscript [ref=f2e569]:
                  - link "[17]" [ref=f2e570] [cursor=pointer]:
                    - /url: "#cite_note-b1-17"
                - superscript [ref=f2e572]:
                  - text: "["
                  - link "page needed" [ref=f2e574] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Wikipedia:Citing_sources
                    - generic "Event-driven programming generally doesn't rely on threads and is often more complex; unclear what was meant in the source. (November 2023)" [ref=f2e575]: page needed
                  - text: "]"
                - text: Node.js connects the ease of a scripting language (JavaScript) with the power of Unix network programming.
                - superscript [ref=f2e576]:
                  - link "[17]" [ref=f2e577] [cursor=pointer]:
                    - /url: "#cite_note-b1-17"
              - paragraph [ref=f2e579]:
                - text: Node.js was built on top of Google's V8 JavaScript engine since it was open-sourced under the
                - link "BSD license" [ref=f2e580] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/BSD_license
                - text: ", and it contains comprehensive support for fundamental protocols such as"
                - link "HTTP" [ref=f2e581] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/HTTP
                - text: ","
                - link "DNS" [ref=f2e582] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/DNS
                - text: and
                - link "TCP" [ref=f2e583] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Transmission_Control_Protocol
                - text: .
                - superscript [ref=f2e584]:
                  - link "[14]" [ref=f2e585] [cursor=pointer]:
                    - /url: "#cite_note-b3-14"
                - text: JavaScript's existing popularity made Node.js accessible to the
                - link "web-development community" [ref=f2e587] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Web_developer
                - text: .
                - superscript [ref=f2e588]:
                  - link "[14]" [ref=f2e589] [cursor=pointer]:
                    - /url: "#cite_note-b3-14"
            - region [ref=f2e591]:
              - generic [ref=f2e592]:
                - heading "Industry support" [level=3] [ref=f2e593]
                - generic [ref=f2e594]:
                  - link "edit":
                    - /url: /w/index.php?title=Node.js&action=edit&section=5
              - paragraph [ref=f2e595]: There are thousands of open-source libraries for Node.js, most of which are hosted on the npm website. Multiple developer conferences and events are held that support the Node.js community, including NodeConf, Node Interactive, and Node Summit, as well as a number of regional events.
              - paragraph [ref=f2e596]:
                - text: The open-source community has developed
                - link "web frameworks" [ref=f2e597] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Web_framework
                - text: to accelerate the development of applications. Such frameworks include
                - link "Express.js" [ref=f2e598] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Express.js
                - text: ","
                - link "Socket.IO" [ref=f2e599] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Socket.IO
