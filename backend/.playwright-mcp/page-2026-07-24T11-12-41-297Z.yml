      - heading "About the role" [level=2] [ref=f4e52]
      - generic [ref=f4e54]:
        - paragraph [ref=f4e55]: "Confido is the AI infrastructure powering CPG brands from deduction to production plan. We unify cash application, deductions, disputes, trade promotion management, forecasting, demand planning, and analytics in one integrated platform. The result: measurable time savings, smarter top- and bottom-line decisions, and the speed to scale."
        - paragraph [ref=f4e56]: Confido is trusted by 200+ brands managing $20B+ in revenue, including OLIPOP, Simple Mills, Dr. Squatch, Tropicana, and more.
        - paragraph [ref=f4e57]: We’ve achieved best-in-class growth and recently raised a $15M Series A led by Footwork Ventures and Y Combinator to accelerate our momentum.
        - paragraph [ref=f4e58]:
          - text: As a
          - strong [ref=f4e59]: Senior Software Engineer (Platform/Core)
          - text: ", you will help build the core infrastructure and product systems that power the Confido platform. This includes everything from large-scale data pipelines and financial analytics systems to AI-powered workflows used by leading CPG brands."
        - paragraph [ref=f4e60]: You’ll work closely with engineering, product, and customers to turn complex operational workflows into reliable, scalable software.
        - paragraph [ref=f4e61]:
          - strong [ref=f4e62]: "Location:"
          - text: New York, NY (Relocation supported)
        - heading "What You'll Do" [level=1] [ref=f4e63]
        - list [ref=f4e64]:
          - listitem [ref=f4e65]:
            - paragraph [ref=f4e66]: Build and scale the core platform that powers financial workflows for CPG brands
          - listitem [ref=f4e67]:
            - paragraph [ref=f4e68]: Develop systems for ingesting and processing financial and operational data from multiple sources
          - listitem [ref=f4e69]:
            - paragraph [ref=f4e70]: Build backend services and APIs that power analytics, forecasting, and automation features
          - listitem [ref=f4e71]:
            - paragraph [ref=f4e72]: Implement AI-powered workflows for document processing and financial data extraction
          - listitem [ref=f4e73]:
            - paragraph [ref=f4e74]: Design intuitive product experiences that turn complex financial data into actionable insights
          - listitem [ref=f4e75]:
            - paragraph [ref=f4e76]: Work directly with product and occasionally customers to understand workflows and ship solutions quickly
        - heading "Example Problems" [level=1] [ref=f4e77]
        - list [ref=f4e78]:
          - listitem [ref=f4e79]:
            - paragraph [ref=f4e80]: AI-powered ingestion of invoices, deductions, and retailer reports
          - listitem [ref=f4e81]:
            - paragraph [ref=f4e82]: Scaling data pipelines that ingest financial data from multiple retailer systems
          - listitem [ref=f4e83]:
            - paragraph [ref=f4e84]: Building analytics infrastructure for forecasting and demand planning
          - listitem [ref=f4e85]:
            - paragraph [ref=f4e86]: Designing internal tools and product features that simplify complex financial workflows
          - listitem [ref=f4e87]:
            - paragraph [ref=f4e88]: Improving performance and reliability across core platform services
        - heading "What We're Looking For" [level=1] [ref=f4e89]
        - paragraph [ref=f4e90]:
          - strong [ref=f4e91]: Required
        - list [ref=f4e92]:
          - listitem [ref=f4e93]:
