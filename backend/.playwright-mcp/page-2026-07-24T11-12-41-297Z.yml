            - paragraph [ref=f4e96]: Strong backend engineering skills and systems design experience
          - listitem [ref=f4e97]:
            - paragraph [ref=f4e98]: Comfort building production systems that handle large datasets or complex workflows
          - listitem [ref=f4e99]:
            - paragraph [ref=f4e100]: Strong product instincts and ability to work across engineering and product
        - paragraph [ref=f4e101]:
