                    - text: ","
                    - link "ArkTS" [ref=f1e198] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/ArkTS
            - paragraph [ref=f1e199]:
              - text: TypeScript (TS) is a
              - link "high-level" [ref=f1e200] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/High-level_programming_language
              - link "programming language" [ref=f1e201] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Programming_language
              - text: that adds
              - link "static typing" [ref=f1e202] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Static_typing
              - text: with optional type
              - link "annotations" [ref=f1e203] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Annotation#Software_and_engineering
              - text: to
              - link "JavaScript" [ref=f1e204] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JavaScript
              - text: . It is designed for developing large applications. It
              - link "transpiles" [ref=f1e205] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Source-to-source_compiler
              - text: to JavaScript.
              - superscript [ref=f1e206]:
                - link "[6]" [ref=f1e207] [cursor=pointer]:
                  - /url: "#cite_note-6"
              - text: It is developed by
              - link "Microsoft" [ref=f1e209] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Microsoft
              - text: as
              - link "free and open-source software" [ref=f1e210] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free_and_open-source_software
              - text: released under an
              - link "Apache License 2.0" [ref=f1e211] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Apache_License_2.0
              - text: .
            - paragraph [ref=f1e212]:
              - text: TypeScript may be used to develop JavaScript applications for both
              - link "client-side" [ref=f1e213] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Client-side
              - text: and
              - link "server-side" [ref=f1e214] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Server-side
              - text: execution (as with
              - link "React.js" [ref=f1e215] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/React.js
              - text: ","
              - link "Node.js" [ref=f1e216] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Node.js
              - text: ","
              - link "Deno" [ref=f1e217] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Deno_(software)
              - text: or
              - link "Bun" [ref=f1e218] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bun_(software)
              - text: ). Multiple options are available for transpiling. The default TypeScript Compiler can be used,
              - superscript [ref=f1e219]:
                - link "[7]" [ref=f1e220] [cursor=pointer]:
                  - /url: "#cite_note-7"
              - text: or the
              - link "Babel" [ref=f1e222] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Babel_(transcompiler)
              - text: compiler can be invoked to convert TypeScript to JavaScript.
            - paragraph [ref=f1e223]:
              - text: TypeScript supports definition files that can contain type information of existing JavaScript
              - link "libraries" [ref=f1e224] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Library_(computing)
              - text: ", much like"
              - link "C++" [ref=f1e225] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/C++
              - link "header files" [ref=f1e226] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Include_directive#Header_file
              - text: can describe the structure of existing
              - link "object files" [ref=f1e227] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Object_file
              - text: . This enables other programs to use the values defined in the files as if they were statically typed TypeScript entities. There are third-party header files for popular libraries such as
              - link "jQuery" [ref=f1e228] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JQuery
              - text: ","
              - link "MongoDB" [ref=f1e229] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/MongoDB
              - text: ", and"
              - link "D3.js" [ref=f1e230] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/D3.js
              - text: . TypeScript headers for the
              - link "Node.js" [ref=f1e231] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Node.js
              - text: library modules are also available, allowing development of Node.js programs within TypeScript.
              - superscript [ref=f1e232]:
                - link "[8]" [ref=f1e233] [cursor=pointer]:
                  - /url: "#cite_note-8"
            - paragraph [ref=f1e235]:
              - text: Before TypeScript 7.0, the TypeScript compiler was
              - link "written in TypeScript" [ref=f1e236] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Self-hosting_(compilers)
              - text: and
              - link "compiled" [ref=f1e237] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Source-to-source_compiler
              - text: to JavaScript. In TypeScript 7.0, it was rewritten in
              - link "Go" [ref=f1e238] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Go_(programming_language)
              - text: .
              - superscript [ref=f1e239]:
                - link "[9]" [ref=f1e240] [cursor=pointer]:
                  - /url: "#cite_note-9"
              - text: It is licensed under the
              - link "Apache License 2.0" [ref=f1e242] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Apache_License_2.0
              - text: .
              - link "Anders Hejlsberg" [ref=f1e243] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Anders_Hejlsberg
              - text: ", lead architect of"
              - link "C#" [ref=f1e244] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/C_Sharp_(programming_language)
              - text: and creator of
              - link "Delphi" [ref=f1e245] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Delphi_(software)
              - text: and
              - link "Turbo Pascal" [ref=f1e246] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Turbo_Pascal
              - text: ", has worked on developing TypeScript."
              - superscript [ref=f1e247]:
                - link "[10]" [ref=f1e248] [cursor=pointer]:
                  - /url: "#cite_note-10"
              - superscript [ref=f1e250]:
                - link "[11]" [ref=f1e251] [cursor=pointer]:
                  - /url: "#cite_note-11"
              - superscript [ref=f1e253]:
                - link "[12]" [ref=f1e254] [cursor=pointer]:
                  - /url: "#cite_note-12"
              - superscript [ref=f1e256]:
                - link "[13]" [ref=f1e257] [cursor=pointer]:
                  - /url: "#cite_note-13"
          - region [ref=f1e259]:
            - generic [ref=f1e260]:
              - heading "History" [level=2] [ref=f1e261]
              - generic [ref=f1e262]:
                - link "edit":
                  - /url: /w/index.php?title=TypeScript&action=edit&section=1
            - paragraph [ref=f1e263]:
              - text: TypeScript was released to the public in October 2012, with version 0.8, after two years of internal development at Microsoft.
              - superscript [ref=f1e264]:
                - link "[14]" [ref=f1e265] [cursor=pointer]:
                  - /url: "#cite_note-14"
              - superscript [ref=f1e267]:
                - link "[15]" [ref=f1e268] [cursor=pointer]:
                  - /url: "#cite_note-15"
              - text: Soon after the initial public release,
              - link "Miguel de Icaza" [ref=f1e270] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Miguel_de_Icaza
              - text: praised the language, but criticized the lack of mature
              - link "integrated development environment" [ref=f1e271] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Integrated_development_environment
              - text: (IDE) support apart from
              - link "Microsoft Visual Studio" [ref=f1e272] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Microsoft_Visual_Studio
              - text: ", which was unavailable then on"
              - link "Linux" [ref=f1e273] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Linux
              - text: and
              - link "macOS" [ref=f1e274] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/MacOS
              - text: .
              - superscript [ref=f1e275]:
                - link "[16]" [ref=f1e276] [cursor=pointer]:
                  - /url: "#cite_note-16"
              - superscript [ref=f1e278]:
                - link "[17]" [ref=f1e279] [cursor=pointer]:
                  - /url: "#cite_note-17"
              - text: As of April 2021 there is support in other IDEs and text editors, including
              - link "Emacs" [ref=f1e281] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Emacs
              - text: ","
              - link "Vim" [ref=f1e282] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Vim_(text_editor)
              - text: ","
              - link "WebStorm" [ref=f1e283] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JetBrains#WebStorm
              - text: ","
              - link "Atom" [ref=f1e284] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Atom_(text_editor)
              - superscript [ref=f1e285]:
                - link "[18]" [ref=f1e286] [cursor=pointer]:
                  - /url: "#cite_note-18"
              - text: and Microsoft's own
              - link "Visual Studio Code" [ref=f1e288] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Visual_Studio_Code
              - text: .
              - superscript [ref=f1e289]:
                - link "[19]" [ref=f1e290] [cursor=pointer]:
                  - /url: "#cite_note-19"
              - text: TypeScript 0.9, released in 2013, added support for
              - link "generics" [ref=f1e292] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Generic_programming
              - text: .
              - superscript [ref=f1e293]:
                - link "[20]" [ref=f1e294] [cursor=pointer]:
                  - /url: "#cite_note-20"
            - paragraph [ref=f1e296]:
              - text: TypeScript 1.0 was released at Microsoft's
              - link "Build" [ref=f1e297] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Build_(developer_conference)
              - text: developer conference in 2014.
              - superscript [ref=f1e298]:
                - link "[21]" [ref=f1e299] [cursor=pointer]:
                  - /url: "#cite_note-21"
              - link "Visual Studio 2013" [ref=f1e301] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Visual_Studio_2013
              - text: Update 2 provided built-in support for TypeScript.
              - superscript [ref=f1e302]:
                - link "[22]" [ref=f1e303] [cursor=pointer]:
                  - /url: "#cite_note-22"
              - text: Further improvement were made in July 2014, when the development team announced a new TypeScript compiler, asserted to have a five-fold performance increase. Simultaneously, the source code, which was initially hosted on
              - link "CodePlex" [ref=f1e305] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/CodePlex
              - text: ", was moved to"
              - link "GitHub" [ref=f1e306] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/GitHub
              - text: .
              - superscript [ref=f1e307]:
                - link "[23]" [ref=f1e308] [cursor=pointer]:
                  - /url: "#cite_note-23"
            - paragraph [ref=f1e310]:
              - text: On 22 September 2016, TypeScript 2.0 was released, introducing several features, including the ability for programmers to optionally enforce
              - link "null safety" [ref=f1e311] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Null_safety
              - text: .
              - superscript [ref=f1e312]:
                - link "[24]" [ref=f1e313] [cursor=pointer]:
                  - /url: "#cite_note-24"
            - paragraph [ref=f1e315]:
              - text: TypeScript 3.0 was released on 30 July 2018,
              - superscript [ref=f1e316]:
                - link "[25]" [ref=f1e317] [cursor=pointer]:
                  - /url: "#cite_note-25"
              - text: bringing many language additions like tuples in rest parameters and spread expressions, rest parameters with tuple types, generic rest parameters and so on.
              - superscript [ref=f1e319]:
                - link "[26]" [ref=f1e320] [cursor=pointer]:
                  - /url: "#cite_note-26"
            - paragraph [ref=f1e322]:
              - text: TypeScript 4.0 was released on 20 August 2020.
              - superscript [ref=f1e323]:
                - link "[27]" [ref=f1e324] [cursor=pointer]:
                  - /url: "#cite_note-:0-27"
              - text: While 4.0 did not introduce any breaking changes, it added language features such as Custom
              - link "JSX" [ref=f1e326] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JSX_(JavaScript)
              - text: Factories and Variadic Tuple Types.
              - superscript [ref=f1e327]:
                - link "[27]" [ref=f1e328] [cursor=pointer]:
                  - /url: "#cite_note-:0-27"
            - paragraph [ref=f1e330]:
              - text: TypeScript 5.0 was released on 16 March 2023 and included support for decorators.
              - superscript [ref=f1e331]:
                - link "[28]" [ref=f1e332] [cursor=pointer]:
                  - /url: "#cite_note-28"
            - paragraph [ref=f1e334]:
              - text: On March 11, 2025, Anders Hejlsberg announced on the TypeScript blog that the team is working on a
              - link "Go" [ref=f1e335] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Go_(programming_language)
              - text: port of the TypeScript compiler to be released as TypeScript version 7.0 later this year. It is expected to feature a 10x
              - link "speedup" [ref=f1e336] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Speedup
              - text: .
              - superscript [ref=f1e337]:
                - link "[29]" [ref=f1e338] [cursor=pointer]:
                  - /url: "#cite_note-29"
            - paragraph [ref=f1e340]:
              - text: On December 2nd, 2025, Daniel Rosenwasser announced on the blog that TypeScript 6.0 will be the last release written in TypeScript itself, and TypeScript 7.0 will be the first Go-based release.
              - superscript [ref=f1e341]:
                - link "[30]" [ref=f1e342] [cursor=pointer]:
                  - /url: "#cite_note-30"
          - region [ref=f1e344]:
            - generic [ref=f1e345]:
              - heading "Design" [level=2] [ref=f1e346]
              - generic [ref=f1e347]:
                - link "edit":
                  - /url: /w/index.php?title=TypeScript&action=edit&section=2
            - paragraph [ref=f1e348]:
              - text: TypeScript originated from the shortcomings of JavaScript for developing large-scale applications both at Microsoft and among their external customers.
              - superscript [ref=f1e349]:
                - link "[31]" [ref=f1e350] [cursor=pointer]:
                  - /url: "#cite_note-31"
              - text: Challenges with dealing with complex JavaScript code led to demand for custom tooling to ease developing of components in the language.
              - superscript [ref=f1e352]:
                - link "[32]" [ref=f1e353] [cursor=pointer]:
                  - /url: "#cite_note-32"
            - paragraph [ref=f1e355]:
              - text: Developers sought a solution that would not break compatibility with the
              - link "ECMAScript" [ref=f1e356] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ECMAScript
              - text: (ES) standard and its ecosystem, so a
              - link "compiler" [ref=f1e357] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Compiler
              - text: was developed to transform a superset of JavaScript with type annotations and classes (TypeScript files) back into vanilla ECMAScript 5 code. TypeScript classes were based on the then-proposed ECMAScript 6 class specification to make writing
              - link "prototypal inheritance" [ref=f1e358] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Prototype-based_programming
              - text: less verbose and error-prone, and type annotations enabled
              - link "IntelliSense" [ref=f1e359] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Code_completion
              - text: and improved tooling.
          - region [ref=f1e360]:
            - generic [ref=f1e361]:
              - heading "Features" [level=2] [ref=f1e362]
              - generic [ref=f1e363]:
                - link "edit":
                  - /url: /w/index.php?title=TypeScript&action=edit&section=3
            - note [ref=f1e364]:
              - text: "Main article:"
              - link "JavaScript syntax § TypeScript-specific features" [ref=f1e365] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JavaScript_syntax#TypeScript-specific_features
            - paragraph [ref=f1e366]: "TypeScript adds the following syntax extensions to JavaScript:"
            - list [ref=f1e367]:
              - listitem [ref=f1e368]:
                - link "Type signatures" [ref=f1e369] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Type_signature
                - text: (annotations) and
                - link "compile-time" [ref=f1e370] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Compile-time
                - link "type checking" [ref=f1e371] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Type_checking
              - listitem [ref=f1e372]:
                - link "Type inference" [ref=f1e373] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Type_inference
              - listitem [ref=f1e374]:
                - link "Interfaces" [ref=f1e375] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Interface_(object-oriented_programming)
              - listitem [ref=f1e376]:
                - link "Enumerated types" [ref=f1e377] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Enumerated_type
              - listitem [ref=f1e378]:
                - link "Generics" [ref=f1e379] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Generic_programming
              - listitem [ref=f1e380]:
                - link "Namespaces" [ref=f1e381] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Namespace
              - listitem [ref=f1e382]:
                - link "Tuples" [ref=f1e383] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tuple
            - paragraph [ref=f1e384]:
              - text: Syntactically, TypeScript is very similar to
              - link "JScript .NET" [ref=f1e385] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JScript_.NET
              - text: ", another Microsoft implementation of the ECMA-262 language standard that added support for static typing and classical object-oriented language features such as classes, inheritance, interfaces, and namespaces. Other inspirations include"
              - link "Java" [ref=f1e386] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Java_(programming_language)
              - text: and
              - link "C#" [ref=f1e387] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/C_Sharp_(programming_language)
              - text: .
          - region [ref=f1e388]:
            - generic [ref=f1e389]:
              - heading "Compatibility with JavaScript" [level=2] [ref=f1e390]
              - generic [ref=f1e391]:
                - link "edit":
                  - /url: /w/index.php?title=TypeScript&action=edit&section=4
            - note [ref=f1e392]:
              - text: "Further information:"
              - link "JavaScript" [ref=f1e393] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JavaScript
            - paragraph [ref=f1e394]: As TypeScript is simply a superset of JavaScript, existing JavaScript can be adapted to TypeScript and TypeScript program can seamlessly consume JavaScript. The compiler can target all ECMAScript versions 5 and above, transpiling modern features like classes and arrow functions to their older counterparts.
            - paragraph [ref=f1e395]:
              - text: With TypeScript, it is possible to use existing JavaScript code, incorporate popular JavaScript libraries, and call TypeScript-generated code from other JavaScript.
              - superscript [ref=f1e396]:
                - link "[33]" [ref=f1e397] [cursor=pointer]:
                  - /url: "#cite_note-typescript-home-page-33"
              - text: Type declarations for these libraries are usually provided with the source code but can be declared or installed separately if needed.
          - region [ref=f1e399]:
