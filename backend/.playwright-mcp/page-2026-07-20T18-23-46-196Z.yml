                - heading "Compiler" [level=3] [ref=f1e668]
                - generic [ref=f1e669]:
                  - text: "["
                  - link "edit" [ref=f1e670] [cursor=pointer]:
                    - /url: /w/index.php?title=TypeScript&action=edit&section=6
                  - text: "]"
              - paragraph [ref=f1e671]:
                - text: The TypeScript compiler, named
                - code [ref=f1e672]: tsc
                - text: ", is"
                - link "written in TypeScript" [ref=f1e673] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Self-hosting_(compilers)
                - text: . As a result, it can be compiled into regular JavaScript and can then be executed in any JavaScript engine (e.g. a browser). The compiler package comes bundled with a script host that can execute the compiler. It is also available as a
                - link "Node.js" [ref=f1e674] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Node.js
                - text: package that uses Node.js as a host. The compiler is currently being ported to
                - link "Go" [ref=f1e675] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Go_(programming_language)
                - text: for version 7.
                - superscript [ref=f1e676]:
                  - link "[34]" [ref=f1e677] [cursor=pointer]:
                    - /url: "#cite_note-34"
              - paragraph [ref=f1e679]:
                - text: The compiler can target a given edition of ECMAScript (such as
                - link "ECMAScript 5" [ref=f1e680] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/ECMAScript_version_history
                - text: for legacy browser compatibility), but by default compiles for the latest standards.
