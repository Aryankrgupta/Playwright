            - paragraph [ref=f1e643]:
              - text: Syntactically, TypeScript is very similar to
              - link "JScript .NET" [ref=f1e644] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JScript_.NET
              - text: ", another Microsoft implementation of the ECMA-262 language standard that added support for static typing and classical object-oriented language features such as classes, inheritance, interfaces, and namespaces. Other inspirations include"
              - link "Java" [ref=f1e645] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Java_(programming_language)
              - text: and
              - link "C#" [ref=f1e646] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/C_Sharp_(programming_language)
              - text: .
          - region [ref=f1e647]:
            - generic [ref=f1e648]:
              - heading "Compatibility with JavaScript" [level=2] [ref=f1e649]
              - generic [ref=f1e650]:
                - text: "["
                - link "edit" [ref=f1e651] [cursor=pointer]:
                  - /url: /w/index.php?title=TypeScript&action=edit&section=4
                - text: "]"
            - note [ref=f1e652]:
              - text: "Further information:"
              - link "JavaScript" [ref=f1e653] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JavaScript
            - paragraph [ref=f1e654]: As TypeScript is simply a superset of JavaScript, existing JavaScript can be adapted to TypeScript and TypeScript program can seamlessly consume JavaScript. The compiler can target all ECMAScript versions 5 and above, transpiling modern features like classes and arrow functions to their older counterparts.
            - paragraph [ref=f1e655]:
              - text: With TypeScript, it is possible to use existing JavaScript code, incorporate popular JavaScript libraries, and call TypeScript-generated code from other JavaScript.
              - superscript [ref=f1e656]:
                - link "[33]" [ref=f1e657] [cursor=pointer]:
                  - /url: "#cite_note-typescript-home-page-33"
              - text: Type declarations for these libraries are usually provided with the source code but can be declared or installed separately if needed.
          - region [ref=f1e659]:
