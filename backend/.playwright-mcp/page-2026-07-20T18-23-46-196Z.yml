                    - text: ","
                    - link "AssemblyScript" [ref=f1e453] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/AssemblyScript
                    - text: ","
                    - link "ArkTS" [ref=f1e454] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/ArkTS
            - paragraph [ref=f1e455]:
              - text: TypeScript (TS) is a
              - link "high-level" [ref=f1e456] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/High-level_programming_language
              - link "programming language" [ref=f1e457] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Programming_language
              - text: that adds
              - link "static typing" [ref=f1e458] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Static_typing
              - text: with optional type
              - link "annotations" [ref=f1e459] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Annotation#Software_and_engineering
              - text: to
              - link "JavaScript" [ref=f1e460] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JavaScript
              - text: . It is designed for developing large applications. It
              - link "transpiles" [ref=f1e461] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Source-to-source_compiler
              - text: to JavaScript.
              - superscript [ref=f1e462]:
                - link "[6]" [ref=f1e463] [cursor=pointer]:
                  - /url: "#cite_note-6"
              - text: It is developed by
              - link "Microsoft" [ref=f1e465] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Microsoft
              - text: as
              - link "free and open-source software" [ref=f1e466] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free_and_open-source_software
              - text: released under an
              - link "Apache License 2.0" [ref=f1e467] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Apache_License_2.0
              - text: .
            - paragraph [ref=f1e468]:
              - text: TypeScript may be used to develop JavaScript applications for both
              - link "client-side" [ref=f1e469] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Client-side
              - text: and
              - link "server-side" [ref=f1e470] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Server-side
              - text: execution (as with
              - link "React.js" [ref=f1e471] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/React.js
              - text: ","
              - link "Node.js" [ref=f1e472] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Node.js
              - text: ","
              - link "Deno" [ref=f1e473] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Deno_(software)
              - text: or
              - link "Bun" [ref=f1e474] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bun_(software)
              - text: ). Multiple options are available for transpiling. The default TypeScript Compiler can be used,
              - superscript [ref=f1e475]:
                - link "[7]" [ref=f1e476] [cursor=pointer]:
                  - /url: "#cite_note-7"
              - text: or the
              - link "Babel" [ref=f1e478] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Babel_(transcompiler)
              - text: compiler can be invoked to convert TypeScript to JavaScript.
            - paragraph [ref=f1e479]:
              - text: TypeScript supports definition files that can contain type information of existing JavaScript
              - link "libraries" [ref=f1e480] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Library_(computing)
              - text: ", much like"
              - link "C++" [ref=f1e481] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/C++
              - link "header files" [ref=f1e482] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Include_directive#Header_file
              - text: can describe the structure of existing
              - link "object files" [ref=f1e483] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Object_file
              - text: . This enables other programs to use the values defined in the files as if they were statically typed TypeScript entities. There are third-party header files for popular libraries such as
              - link "jQuery" [ref=f1e484] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JQuery
              - text: ","
              - link "MongoDB" [ref=f1e485] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/MongoDB
              - text: ", and"
              - link "D3.js" [ref=f1e486] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/D3.js
              - text: . TypeScript headers for the
              - link "Node.js" [ref=f1e487] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Node.js
              - text: library modules are also available, allowing development of Node.js programs within TypeScript.
              - superscript [ref=f1e488]:
                - link "[8]" [ref=f1e489] [cursor=pointer]:
                  - /url: "#cite_note-8"
            - paragraph [ref=f1e491]:
              - text: Before TypeScript 7.0, the TypeScript compiler was
              - link "written in TypeScript" [ref=f1e492] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Self-hosting_(compilers)
              - text: and
              - link "compiled" [ref=f1e493] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Source-to-source_compiler
              - text: to JavaScript. In TypeScript 7.0, it was rewritten in
              - link "Go" [ref=f1e494] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Go_(programming_language)
              - text: .
              - superscript [ref=f1e495]:
                - link "[9]" [ref=f1e496] [cursor=pointer]:
                  - /url: "#cite_note-9"
              - text: It is licensed under the
              - link "Apache License 2.0" [ref=f1e498] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Apache_License_2.0
              - text: .
              - link "Anders Hejlsberg" [ref=f1e499] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Anders_Hejlsberg
              - text: ", lead architect of"
              - link "C#" [ref=f1e500] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/C_Sharp_(programming_language)
              - text: and creator of
              - link "Delphi" [ref=f1e501] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Delphi_(software)
              - text: and
              - link "Turbo Pascal" [ref=f1e502] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Turbo_Pascal
              - text: ", has worked on developing TypeScript."
              - superscript [ref=f1e503]:
                - link "[10]" [ref=f1e504] [cursor=pointer]:
                  - /url: "#cite_note-10"
              - superscript [ref=f1e506]:
                - link "[11]" [ref=f1e507] [cursor=pointer]:
                  - /url: "#cite_note-11"
              - superscript [ref=f1e509]:
                - link "[12]" [ref=f1e510] [cursor=pointer]:
                  - /url: "#cite_note-12"
              - superscript [ref=f1e512]:
                - link "[13]" [ref=f1e513] [cursor=pointer]:
                  - /url: "#cite_note-13"
          - region [ref=f1e515]:
            - generic [ref=f1e516]:
              - heading "History" [level=2] [ref=f1e517]
              - generic [ref=f1e518]:
                - text: "["
                - link "edit" [ref=f1e519] [cursor=pointer]:
                  - /url: /w/index.php?title=TypeScript&action=edit&section=1
                - text: "]"
            - paragraph [ref=f1e520]:
              - text: TypeScript was released to the public in October 2012, with version 0.8, after two years of internal development at Microsoft.
              - superscript [ref=f1e521]:
                - link "[14]" [ref=f1e522] [cursor=pointer]:
                  - /url: "#cite_note-14"
              - superscript [ref=f1e524]:
                - link "[15]" [ref=f1e525] [cursor=pointer]:
                  - /url: "#cite_note-15"
              - text: Soon after the initial public release,
              - link "Miguel de Icaza" [ref=f1e527] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Miguel_de_Icaza
              - text: praised the language, but criticized the lack of mature
              - link "integrated development environment" [ref=f1e528] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Integrated_development_environment
              - text: (IDE) support apart from
              - link "Microsoft Visual Studio" [ref=f1e529] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Microsoft_Visual_Studio
              - text: ", which was unavailable then on"
              - link "Linux" [ref=f1e530] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Linux
              - text: and
              - link "macOS" [ref=f1e531] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/MacOS
              - text: .
              - superscript [ref=f1e532]:
                - link "[16]" [ref=f1e533] [cursor=pointer]:
                  - /url: "#cite_note-16"
              - superscript [ref=f1e535]:
                - link "[17]" [ref=f1e536] [cursor=pointer]:
                  - /url: "#cite_note-17"
              - text: As of April 2021 there is support in other IDEs and text editors, including
              - link "Emacs" [ref=f1e538] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Emacs
              - text: ","
              - link "Vim" [ref=f1e539] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Vim_(text_editor)
              - text: ","
              - link "WebStorm" [ref=f1e540] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JetBrains#WebStorm
              - text: ","
              - link "Atom" [ref=f1e541] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Atom_(text_editor)
              - superscript [ref=f1e542]:
                - link "[18]" [ref=f1e543] [cursor=pointer]:
                  - /url: "#cite_note-18"
              - text: and Microsoft's own
              - link "Visual Studio Code" [ref=f1e545] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Visual_Studio_Code
              - text: .
              - superscript [ref=f1e546]:
                - link "[19]" [ref=f1e547] [cursor=pointer]:
                  - /url: "#cite_note-19"
              - text: TypeScript 0.9, released in 2013, added support for
              - link "generics" [ref=f1e549] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Generic_programming
              - text: .
              - superscript [ref=f1e550]:
                - link "[20]" [ref=f1e551] [cursor=pointer]:
                  - /url: "#cite_note-20"
            - paragraph [ref=f1e553]:
              - text: TypeScript 1.0 was released at Microsoft's
              - link "Build" [ref=f1e554] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Build_(developer_conference)
              - text: developer conference in 2014.
              - superscript [ref=f1e555]:
                - link "[21]" [ref=f1e556] [cursor=pointer]:
                  - /url: "#cite_note-21"
              - link "Visual Studio 2013" [ref=f1e558] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Visual_Studio_2013
              - text: Update 2 provided built-in support for TypeScript.
              - superscript [ref=f1e559]:
                - link "[22]" [ref=f1e560] [cursor=pointer]:
                  - /url: "#cite_note-22"
              - text: Further improvement were made in July 2014, when the development team announced a new TypeScript compiler, asserted to have a five-fold performance increase. Simultaneously, the source code, which was initially hosted on
              - link "CodePlex" [ref=f1e562] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/CodePlex
              - text: ", was moved to"
              - link "GitHub" [ref=f1e563] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/GitHub
              - text: .
              - superscript [ref=f1e564]:
                - link "[23]" [ref=f1e565] [cursor=pointer]:
                  - /url: "#cite_note-23"
            - paragraph [ref=f1e567]:
              - text: On 22 September 2016, TypeScript 2.0 was released, introducing several features, including the ability for programmers to optionally enforce
              - link "null safety" [ref=f1e568] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Null_safety
              - text: .
              - superscript [ref=f1e569]:
                - link "[24]" [ref=f1e570] [cursor=pointer]:
                  - /url: "#cite_note-24"
            - paragraph [ref=f1e572]:
              - text: TypeScript 3.0 was released on 30 July 2018,
              - superscript [ref=f1e573]:
                - link "[25]" [ref=f1e574] [cursor=pointer]:
                  - /url: "#cite_note-25"
              - text: bringing many language additions like tuples in rest parameters and spread expressions, rest parameters with tuple types, generic rest parameters and so on.
              - superscript [ref=f1e576]:
                - link "[26]" [ref=f1e577] [cursor=pointer]:
                  - /url: "#cite_note-26"
            - paragraph [ref=f1e579]:
              - text: TypeScript 4.0 was released on 20 August 2020.
              - superscript [ref=f1e580]:
                - link "[27]" [ref=f1e581] [cursor=pointer]:
                  - /url: "#cite_note-:0-27"
              - text: While 4.0 did not introduce any breaking changes, it added language features such as Custom
              - link "JSX" [ref=f1e583] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JSX_(JavaScript)
              - text: Factories and Variadic Tuple Types.
              - superscript [ref=f1e584]:
                - link "[27]" [ref=f1e585] [cursor=pointer]:
                  - /url: "#cite_note-:0-27"
            - paragraph [ref=f1e587]:
              - text: TypeScript 5.0 was released on 16 March 2023 and included support for decorators.
              - superscript [ref=f1e588]:
                - link "[28]" [ref=f1e589] [cursor=pointer]:
                  - /url: "#cite_note-28"
            - paragraph [ref=f1e591]:
              - text: On March 11, 2025, Anders Hejlsberg announced on the TypeScript blog that the team is working on a
              - link "Go" [ref=f1e592] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Go_(programming_language)
              - text: port of the TypeScript compiler to be released as TypeScript version 7.0 later this year. It is expected to feature a 10x
              - link "speedup" [ref=f1e593] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Speedup
              - text: .
              - superscript [ref=f1e594]:
                - link "[29]" [ref=f1e595] [cursor=pointer]:
                  - /url: "#cite_note-29"
            - paragraph [ref=f1e597]:
              - text: On December 2nd, 2025, Daniel Rosenwasser announced on the blog that TypeScript 6.0 will be the last release written in TypeScript itself, and TypeScript 7.0 will be the first Go-based release.
              - superscript [ref=f1e598]:
                - link "[30]" [ref=f1e599] [cursor=pointer]:
                  - /url: "#cite_note-30"
          - region [ref=f1e601]:
            - generic [ref=f1e602]:
              - heading "Design" [level=2] [ref=f1e603]
              - generic [ref=f1e604]:
                - text: "["
                - link "edit" [ref=f1e605] [cursor=pointer]:
                  - /url: /w/index.php?title=TypeScript&action=edit&section=2
                - text: "]"
            - paragraph [ref=f1e606]:
              - text: TypeScript originated from the shortcomings of JavaScript for developing large-scale applications both at Microsoft and among their external customers.
              - superscript [ref=f1e607]:
                - link "[31]" [ref=f1e608] [cursor=pointer]:
                  - /url: "#cite_note-31"
              - text: Challenges with dealing with complex JavaScript code led to demand for custom tooling to ease developing of components in the language.
              - superscript [ref=f1e610]:
                - link "[32]" [ref=f1e611] [cursor=pointer]:
                  - /url: "#cite_note-32"
            - paragraph [ref=f1e613]:
              - text: Developers sought a solution that would not break compatibility with the
              - link "ECMAScript" [ref=f1e614] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ECMAScript
              - text: (ES) standard and its ecosystem, so a
              - link "compiler" [ref=f1e615] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Compiler
              - text: was developed to transform a superset of JavaScript with type annotations and classes (TypeScript files) back into vanilla ECMAScript 5 code. TypeScript classes were based on the then-proposed ECMAScript 6 class specification to make writing
              - link "prototypal inheritance" [ref=f1e616] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Prototype-based_programming
              - text: less verbose and error-prone, and type annotations enabled
              - link "IntelliSense" [ref=f1e617] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Code_completion
              - text: and improved tooling.
          - region [ref=f1e618]:
            - generic [ref=f1e619]:
              - heading "Features" [level=2] [ref=f1e620]
              - generic [ref=f1e621]:
                - text: "["
                - link "edit" [ref=f1e622] [cursor=pointer]:
                  - /url: /w/index.php?title=TypeScript&action=edit&section=3
                - text: "]"
            - note [ref=f1e623]:
              - text: "Main article:"
              - link "JavaScript syntax § TypeScript-specific features" [ref=f1e624] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JavaScript_syntax#TypeScript-specific_features
            - paragraph [ref=f1e625]: "TypeScript adds the following syntax extensions to JavaScript:"
            - list [ref=f1e626]:
              - listitem [ref=f1e627]:
                - link "Type signatures" [ref=f1e628] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Type_signature
                - text: (annotations) and
                - link "compile-time" [ref=f1e629] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Compile-time
                - link "type checking" [ref=f1e630] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Type_checking
              - listitem [ref=f1e631]:
