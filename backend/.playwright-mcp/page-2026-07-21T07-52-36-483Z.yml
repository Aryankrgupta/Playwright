                  - /url: "#cite_note-7"
              - text: unifying
              - link "web-application" [ref=f1e333] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Web_application
              - text: development around a single
              - link "programming language" [ref=f1e334] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Programming_language
              - text: ", as opposed to using different languages for the server- versus client-side programming."
            - paragraph [ref=f1e335]:
              - text: Node.js has an
              - link "event-driven architecture" [ref=f1e336] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Event-driven_architecture
              - text: capable of
              - link "asynchronous I/O" [ref=f1e337] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Asynchronous_I/O
              - text: . These design choices aim to optimize
              - link "throughput" [ref=f1e338] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Throughput
              - text: and
              - link "scalability" [ref=f1e339] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Scalability
              - text: in web applications with many input/output operations, as well as for
              - link "real-time Web" [ref=f1e340] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Real-time_Web
              - text: applications (e.g.,
              - link "real-time communication" [ref=f1e341] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Real-time_communication
              - text: programs and
              - link "browser games" [ref=f1e342] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Browser_game
              - text: ).
              - superscript [ref=f1e343]:
                - link "[8]" [ref=f1e344] [cursor=pointer]:
                  - /url: "#cite_note-readwrite-8"
            - paragraph [ref=f1e345]:
              - text: The Node.js
              - link "distributed development" [ref=f1e346] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Distributed_development
              - text: project was previously governed by the Node.js Foundation,
              - superscript [ref=f1e347]:
                - link "[9]" [ref=f1e348] [cursor=pointer]:
                  - /url: "#cite_note-9"
              - text: and has now merged with the
              - link "JS Foundation" [ref=f1e349] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/JS_Foundation
              - text: to form the
              - link "OpenJS Foundation" [ref=f1e350] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/OpenJS_Foundation
              - text: . OpenJS Foundation is facilitated by the
              - link "Linux Foundation" [ref=f1e351] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Linux_Foundation
              - text: "'s Collaborative Projects program."
              - superscript [ref=f1e352]:
                - link "[10]" [ref=f1e353] [cursor=pointer]:
                  - /url: "#cite_note-10"
          - region [ref=f1e354]:
            - generic [ref=f1e355]:
              - heading "History" [level=2] [ref=f1e356]
              - generic [ref=f1e357]:
                - link "edit":
                  - /url: /w/index.php?title=Node.js&action=edit&section=1
            - figure "Ryan Dahl, creator of Node.js, in 2010" [ref=f1e358]:
              - link [ref=f1e359] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:Ryan_Dahl.jpg
            - figure "Rocket Turtle, the official mascot of Node.js since February 2024" [ref=f1e361]:
              - link [ref=f1e362] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:Node.JS_Mascot.svg
            - paragraph [ref=f1e365]:
              - text: Node.js was initially written by
              - link "Ryan Dahl" [ref=f1e366] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Ryan_Dahl
              - text: in 2009,
              - superscript [ref=f1e367]:
                - link "[11]" [ref=f1e368] [cursor=pointer]:
                  - /url: "#cite_note-training.com-11"
              - text: about 13 years after the introduction of the first server-side JavaScript environment,
              - link "Netscape" [ref=f1e369] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Netscape
              - text: "'s LiveWire Pro Web."
              - superscript [ref=f1e370]:
                - link "[12]" [ref=f1e371] [cursor=pointer]:
                  - /url: "#cite_note-12"
              - text: The initial release supported only Linux and Mac OS X. Its development and maintenance was led by Dahl and later sponsored by
              - link "Joyent" [ref=f1e372] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Joyent
              - text: .
              - superscript [ref=f1e373]:
                - link "[13]" [ref=f1e374] [cursor=pointer]:
                  - /url: "#cite_note-Google_Groups_post_by_Ryan_Dahl_about_Joyent-13"
            - paragraph [ref=f1e375]:
              - text: Dahl criticized the limited capability of
              - link "Apache HTTP Server" [ref=f1e376] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Apache_HTTP_Server
              - text: to handle many (10,000+) concurrent connections, as well as the dominant programming paradigm of sequential programming, in which applications could block entire processes or cause the creation of multiple execution stacks for simultaneous connections.
              - superscript [ref=f1e377]:
                - text: "["
                - link "citation needed" [ref=f1e379] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                - text: "]"
            - paragraph [ref=f1e380]:
              - text: Dahl demonstrated the project at the inaugural European JSConf on November 8, 2009.
              - superscript [ref=f1e381]:
                - link "[14]" [ref=f1e382] [cursor=pointer]:
                  - /url: "#cite_note-b3-14"
              - superscript [ref=f1e383]:
                - link "[15]" [ref=f1e384] [cursor=pointer]:
                  - /url: "#cite_note-15"
              - superscript [ref=f1e385]:
                - link "[16]" [ref=f1e386] [cursor=pointer]:
                  - /url: "#cite_note-16"
              - text: Node.js combined
              - link "Google" [ref=f1e387] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Google
              - text: "'s"
              - link "V8" [ref=f1e388] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/V8_(JavaScript_engine)
              - text: JavaScript engine, an
              - link "event loop" [ref=f1e389] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Event_loop
              - text: ", and a low-level"
              - link "I/O" [ref=f1e390] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Input/output
              - link "API" [ref=f1e391] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/API
              - text: .
              - superscript [ref=f1e392]:
                - link "[17]" [ref=f1e393] [cursor=pointer]:
                  - /url: "#cite_note-b1-17"
            - paragraph [ref=f1e394]:
              - text: In January 2010, a
              - link "package manager" [ref=f1e395] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Package_manager
              - text: was introduced for the Node.js environment called
              - link "npm" [ref=f1e396] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Npm_(software)
              - text: .
              - superscript [ref=f1e397]:
                - link "[18]" [ref=f1e398] [cursor=pointer]:
                  - /url: "#cite_note-18"
              - text: The package manager allows programmers to publish and share Node.js
              - link "packages" [ref=f1e399] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Package_manager
              - text: ", along with the accompanying source code, and is designed to simplify the installation, update and uninstallation of packages."
              - superscript [ref=f1e400]:
                - link "[17]" [ref=f1e401] [cursor=pointer]:
                  - /url: "#cite_note-b1-17"
            - paragraph [ref=f1e402]:
              - text: In June 2011, Microsoft and Joyent implemented a native
              - link "Windows" [ref=f1e403] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Microsoft_Windows
              - text: version of Node.js.
              - superscript [ref=f1e404]:
                - link "[19]" [ref=f1e405] [cursor=pointer]:
                  - /url: "#cite_note-19"
              - text: The first Node.js build supporting Windows was released in July 2011.
            - paragraph [ref=f1e406]:
              - text: In January 2012, Dahl yielded management of the project to npm creator Isaac Schlueter.
              - superscript [ref=f1e407]:
                - link "[20]" [ref=f1e408] [cursor=pointer]:
                  - /url: "#cite_note-20"
              - text: In January 2014, Schlueter announced that Timothy J. Fontaine would lead the project.
              - superscript [ref=f1e409]:
                - link "[21]" [ref=f1e410] [cursor=pointer]:
                  - /url: "#cite_note-21"
            - paragraph [ref=f1e411]:
              - text: In December 2014, Fedor Indutny created io.js, a
              - link "fork" [ref=f1e412] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Fork_(software_development)
              - text: of Node.js created because of dissatisfaction with Joyent's governance as an
              - link "open-governance" [ref=f1e413] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Open_governance
              - text: alternative with a separate technical committee. The goal was to enable a structure that would be more receptive to community input, including the updating of io.js with the latest Google V8 JavaScript engine releases, diverging from Node.js's approach at that time.
              - superscript [ref=f1e414]:
                - link "[22]" [ref=f1e415] [cursor=pointer]:
                  - /url: "#cite_note-iwtw-22"
            - paragraph [ref=f1e416]:
              - text: The Node.js Foundation, formed to reconcile Node.js and io.js under a unified banner, was announced in February 2015.
              - superscript [ref=f1e417]:
                - link "[23]" [ref=f1e418] [cursor=pointer]:
                  - /url: "#cite_note-23"
              - text: The merger was realized in September 2015 with Node.js v0.12 and io.js v3.3 combining into Node v4.0.
              - superscript [ref=f1e419]:
                - link "[24]" [ref=f1e420] [cursor=pointer]:
                  - /url: "#cite_note-24"
              - text: This merge brought V8
              - link "ES6" [ref=f1e421] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/ECMAScript#ES2015
              - text: features into Node.js and started a long-term support release cycle.
              - superscript [ref=f1e422]:
                - link "[25]" [ref=f1e423] [cursor=pointer]:
                  - /url: "#cite_note-25"
              - text: By 2016, the io.js website recommended returning to Node.js and announced no further io.js releases, effectively ending the fork and solidifying the merger's success.
              - superscript [ref=f1e424]:
                - link "[26]" [ref=f1e425] [cursor=pointer]:
                  - /url: "#cite_note-26"
            - paragraph [ref=f1e426]:
              - text: In 2019, the JS Foundation and Node.js Foundation merged to form the
              - link "OpenJS Foundation" [ref=f1e427] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/OpenJS_Foundation
              - text: .
            - region [ref=f1e428]:
              - generic [ref=f1e429]:
                - heading "Branding" [level=3] [ref=f1e430]
                - generic [ref=f1e431]:
                  - link "edit":
                    - /url: /w/index.php?title=Node.js&action=edit&section=2
              - paragraph [ref=f1e432]:
                - text: The Node.js logo features a green hexagon with overlapping bands to represent the cross-platform nature of the runtime.
                - superscript [ref=f1e433]:
                  - link "[27]" [ref=f1e434] [cursor=pointer]:
                    - /url: "#cite_note-27"
                - text: The Rocket Turtle was chosen as the official Node.js mascot in February 2024 following a design contest.
                - superscript [ref=f1e435]:
                  - link "[28]" [ref=f1e436] [cursor=pointer]:
                    - /url: "#cite_note-28"
          - region [ref=f1e437]:
            - generic [ref=f1e438]:
              - heading "Overview" [level=2] [ref=f1e439]
              - generic [ref=f1e440]:
                - link "edit":
                  - /url: /w/index.php?title=Node.js&action=edit&section=3
            - paragraph [ref=f1e441]:
              - text: Node.js allows the creation of
              - link "web servers" [ref=f1e442] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Web_server
              - text: and networking tools using
              - link "JavaScript" [ref=f1e443] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/JavaScript
              - text: and a collection of "modules" that handle various core functionalities.
              - superscript [ref=f1e444]:
                - link "[14]" [ref=f1e445] [cursor=pointer]:
                  - /url: "#cite_note-b3-14"
              - superscript [ref=f1e446]:
                - link "[17]" [ref=f1e447] [cursor=pointer]:
                  - /url: "#cite_note-b1-17"
              - superscript [ref=f1e448]:
                - link "[29]" [ref=f1e449] [cursor=pointer]:
                  - /url: "#cite_note-b2-29"
              - superscript [ref=f1e450]:
                - link "[30]" [ref=f1e451] [cursor=pointer]:
                  - /url: "#cite_note-b4-30"
              - superscript [ref=f1e452]:
                - link "[31]" [ref=f1e453] [cursor=pointer]:
                  - /url: "#cite_note-b5-31"
              - superscript [ref=f1e454]:
                - text: "["
                - link "excessive citations" [ref=f1e456] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Wikipedia:Citing_sources#Bundling_citations
                - text: "]"
              - text: Modules are provided for
              - link "file system" [ref=f1e457] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File_system
              - text: I/O, networking (
              - link "DNS" [ref=f1e458] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Domain_Name_System
              - text: ","
              - link "HTTP" [ref=f1e459] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/HTTP
              - text: ","
              - link "TCP" [ref=f1e460] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Transmission_Control_Protocol
              - text: ","
              - link "TLS/SSL" [ref=f1e461] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Transport_Layer_Security
              - text: or
              - link "UDP" [ref=f1e462] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/User_Datagram_Protocol
              - text: ),
              - link "binary" [ref=f1e463] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Binary_file
              - text: data (buffers),
              - link "cryptography" [ref=f1e464] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Cryptography
              - text: functions,
              - link "data streams" [ref=f1e465] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Stream_(computing)
              - text: and other core functions.
              - superscript [ref=f1e466]:
                - link "[17]" [ref=f1e467] [cursor=pointer]:
                  - /url: "#cite_note-b1-17"
              - superscript [ref=f1e468]:
                - link "[30]" [ref=f1e469] [cursor=pointer]:
                  - /url: "#cite_note-b4-30"
              - superscript [ref=f1e470]:
                - link "[32]" [ref=f1e471] [cursor=pointer]:
                  - /url: "#cite_note-32"
              - text: Node.js's modules use an API designed to reduce the complexity of writing server applications.
              - superscript [ref=f1e472]:
                - link "[17]" [ref=f1e473] [cursor=pointer]:
                  - /url: "#cite_note-b1-17"
              - superscript [ref=f1e474]:
                - link "[30]" [ref=f1e475] [cursor=pointer]:
                  - /url: "#cite_note-b4-30"
            - paragraph [ref=f1e476]:
              - text: Since version 22.6.0, Node.js natively supports both
              - link "JavaScript" [ref=f1e477] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/JavaScript
              - text: and
              - link "TypeScript" [ref=f1e478] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/TypeScript
              - text: ", allowing TypeScript files to be executed without a separate compilation step."
              - superscript [ref=f1e479]:
                - link "[33]" [ref=f1e480] [cursor=pointer]:
                  - /url: "#cite_note-33"
              - text: The TypeScript support was contributed by Node.js TSC member Marco Ippolito. In addition, many
              - link "compile-to-JS" [ref=f1e481] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Source-to-source_compiler
              - text: languages are available,
              - superscript [ref=f1e482]:
                - link "[34]" [ref=f1e483] [cursor=pointer]:
                  - /url: "#cite_note-34"
              - text: allowing Node.js applications to also be written in
              - link "CoffeeScript" [ref=f1e484] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/CoffeeScript
              - text: ","
              - superscript [ref=f1e485]:
                - link "[35]" [ref=f1e486] [cursor=pointer]:
                  - /url: "#cite_note-b6-35"
              - link "Dart" [ref=f1e487] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Dart_(programming_language)
              - text: ","
              - link "ClojureScript" [ref=f1e488] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/ClojureScript
              - text: ", and others."
            - paragraph [ref=f1e489]:
              - text: Node.js is primarily used to build network programs such as web servers.
              - superscript [ref=f1e490]:
                - link "[29]" [ref=f1e491] [cursor=pointer]:
                  - /url: "#cite_note-b2-29"
              - text: The most significant difference between Node.js and
              - link "PHP" [ref=f1e492] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/PHP
              - text: is that most functions in PHP
              - link "block" [ref=f1e493] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Asynchronous_I/O
              - text: until completion (commands execute only after previous commands finish), while Node.js functions are
              - link "non-blocking" [ref=f1e494] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Asynchronous_I/O
              - text: (commands execute
              - link "concurrently" [ref=f1e495] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Concurrent_computing
              - text: and use
              - link "callbacks" [ref=f1e496] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Callback_(computer_programming)
              - text: to signal completion or failure).
              - superscript [ref=f1e497]:
                - link "[29]" [ref=f1e498] [cursor=pointer]:
                  - /url: "#cite_note-b2-29"
            - paragraph [ref=f1e499]:
              - text: Node.js is officially supported by
              - link "Linux" [ref=f1e500] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Linux
              - text: ","
              - link "macOS" [ref=f1e502] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/MacOS
              - text: and
              - link "Microsoft Windows" [ref=f1e503] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Microsoft_Windows
              - text: 8.1 and Server 2012 (and later),
              - superscript [ref=f1e504]:
                - link "[3]" [ref=f1e505] [cursor=pointer]:
                  - /url: "#cite_note-supportedOS-3"
              - text: with Tier 2 support for
              - link "SmartOS" [ref=f1e506] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/SmartOS
              - text: and
              - link "IBM AIX" [ref=f1e507] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/IBM_AIX
              - text: and experimental support for
              - link "FreeBSD" [ref=f1e508] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/FreeBSD
              - text: .
              - link "OpenBSD" [ref=f1e509] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/OpenBSD
              - text: also works, and LTS versions are available for
              - link "IBM i" [ref=f1e510] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/IBM_i
              - text: (AS/400).
              - superscript [ref=f1e511]:
                - link "[36]" [ref=f1e512] [cursor=pointer]:
                  - /url: "#cite_note-36"
              - text: The source code may also be built on similar operating systems that are not officially supported, such as
              - link "NonStop OS" [ref=f1e513] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/NonStop_OS
              - superscript [ref=f1e514]:
                - link "[37]" [ref=f1e515] [cursor=pointer]:
                  - /url: "#cite_note-bomBora_-_Node.js_for_NonStop-37"
              - text: and
              - link "Unix" [ref=f1e516] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Unix
              - text: servers.
            - region [ref=f1e517]:
              - generic [ref=f1e518]:
                - heading "Platform architecture" [level=3] [ref=f1e519]
                - generic [ref=f1e520]:
                  - link "edit":
                    - /url: /w/index.php?title=Node.js&action=edit&section=4
              - paragraph [ref=f1e521]:
                - text: Node.js enables development of fast web servers in JavaScript using
                - link "event-driven programming" [ref=f1e522] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Event-driven_programming
                - text: .
                - superscript [ref=f1e523]:
                  - link "[17]" [ref=f1e524] [cursor=pointer]:
                    - /url: "#cite_note-b1-17"
                - text: Developers can create scalable servers without using
                - link "threading" [ref=f1e525] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Thread_(computing)
                - text: by using a simplified model that uses
                - link "callbacks" [ref=f1e526] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Callback_(computer_programming)
                - text: to signal the completion of a task.
                - superscript [ref=f1e527]:
                  - link "[17]" [ref=f1e528] [cursor=pointer]:
                    - /url: "#cite_note-b1-17"
                - superscript [ref=f1e529]:
                  - text: "["
                  - link "page needed" [ref=f1e531] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Wikipedia:Citing_sources
                    - generic "Event-driven programming generally doesn't rely on threads and is often more complex; unclear what was meant in the source. (November 2023)" [ref=f1e532]: page needed
                  - text: "]"
                - text: Node.js connects the ease of a scripting language (JavaScript) with the power of Unix network programming.
                - superscript [ref=f1e533]:
                  - link "[17]" [ref=f1e534] [cursor=pointer]:
                    - /url: "#cite_note-b1-17"
              - paragraph [ref=f1e535]:
                - text: Node.js was built on top of Google's V8 JavaScript engine since it was open-sourced under the
                - link "BSD license" [ref=f1e536] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/BSD_license
                - text: ", and it contains comprehensive support for fundamental protocols such as"
                - link "HTTP" [ref=f1e537] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/HTTP
                - text: ","
                - link "DNS" [ref=f1e538] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/DNS
                - text: and
                - link "TCP" [ref=f1e539] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Transmission_Control_Protocol
                - text: .
                - superscript [ref=f1e540]:
                  - link "[14]" [ref=f1e541] [cursor=pointer]:
                    - /url: "#cite_note-b3-14"
                - text: JavaScript's existing popularity made Node.js accessible to the
                - link "web-development community" [ref=f1e542] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Web_developer
                - text: .
                - superscript [ref=f1e543]:
                  - link "[14]" [ref=f1e544] [cursor=pointer]:
                    - /url: "#cite_note-b3-14"
            - region [ref=f1e545]:
              - generic [ref=f1e546]:
                - heading "Industry support" [level=3] [ref=f1e547]
                - generic [ref=f1e548]:
                  - link "edit":
                    - /url: /w/index.php?title=Node.js&action=edit&section=5
              - paragraph [ref=f1e549]: There are thousands of open-source libraries for Node.js, most of which are hosted on the npm website. Multiple developer conferences and events are held that support the Node.js community, including NodeConf, Node Interactive, and Node Summit, as well as a number of regional events.
              - paragraph [ref=f1e550]:
                - text: The open-source community has developed
