              - text: . Running Javascript on the server is commonly used to generate
              - link "dynamic web page" [ref=f1e329] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Dynamic_web_page
              - text: content before the page is sent to the user's web browser. Consequently, Node.js represents a "JavaScript everywhere"
