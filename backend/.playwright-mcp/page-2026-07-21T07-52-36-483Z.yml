            - paragraph [ref=f1e612]:
              - text: New major releases of Node.js are cut from the
              - link "GitHub" [ref=f1e613] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/GitHub
              - text: main branch every six months. Even-numbered versions are cut in April and odd-numbered versions are cut in October. When a new odd version is released, the previous even version undergoes transition to
              - link "Long Term Support" [ref=f1e614] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Long-term_support
              - text: (LTS), which gives that version 12 months of active support from the date it is designated LTS. After these 12 months expire, an LTS release receives an additional 18 months of maintenance support. An active version receives non-breaking backports of changes a few weeks after they land in the current release. A maintenance release receives only critical fixes and documentation updates.
              - superscript [ref=f1e615]:
                - link "[51]" [ref=f1e616] [cursor=pointer]:
                  - /url: "#cite_note-Release-51"
              - text: The LTS Working Group manages strategy and policy in collaboration with the Technical Steering Committee of the Node.js Foundation.
