                    - link "webmproject.org" [ref=f1e384] [cursor=pointer]:
                      - /url: https://www.webmproject.org/
            - paragraph [ref=f1e385]:
              - text: WebM is an audiovisual media file format.
              - superscript [ref=f1e386]:
                - link "[5]" [ref=f1e387] [cursor=pointer]:
                  - /url: "#cite_note-5"
              - text: It is primarily intended to offer a
              - link "royalty-free" [ref=f1e388] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Royalty-free
              - text: alternative to use in
              - link "HTML video" [ref=f1e389] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/HTML_video
              - text: and
              - link "HTML audio" [ref=f1e390] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/HTML_audio
              - text: "elements. It has a sister project for images:"
              - link "WebP" [ref=f1e391] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/WebP
              - text: . The development of the format is sponsored by
              - link "Google" [ref=f1e392] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Google
              - text: ", and the corresponding software is distributed under a"
              - link "BSD license" [ref=f1e393] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/BSD_licenses
              - text: . WebM was a collaborative effort first released in 2010.
            - paragraph [ref=f1e394]:
              - text: The WebM
              - link "container" [ref=f1e395] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Container_format
              - text: is based on a
              - link "profile" [ref=f1e396] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Profile_(engineering)
              - text: of
              - link "Matroska" [ref=f1e397] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Matroska
              - text: .
              - superscript [ref=f1e398]:
                - link "[3]" [ref=f1e399] [cursor=pointer]:
                  - /url: "#cite_note-wemb-off-faq-3"
              - superscript [ref=f1e400]:
                - link "[6]" [ref=f1e401] [cursor=pointer]:
                  - /url: "#cite_note-6"
              - superscript [ref=f1e402]:
                - link "[7]" [ref=f1e403] [cursor=pointer]:
                  - /url: "#cite_note-7"
              - text: WebM initially supported
              - link "VP8" [ref=f1e404] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/VP8
              - text: video and
              - link "Vorbis" [ref=f1e405] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Vorbis
              - text: audio streams. In 2013, it was updated to accommodate
              - link "VP9" [ref=f1e406] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/VP9
              - text: video and
              - link "Opus" [ref=f1e407] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Opus_(audio_format)
              - text: audio.
              - superscript [ref=f1e408]:
                - link "[8]" [ref=f1e409] [cursor=pointer]:
                  - /url: "#cite_note-8"
              - text: It also supports the
              - link "AV1" [ref=f1e410] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/AV1
              - text: codec.
              - superscript [ref=f1e411]:
                - link "[9]" [ref=f1e412] [cursor=pointer]:
                  - /url: "#cite_note-9"
            - figure "An example of a WebM video" [ref=f1e413]:
              - button "Play video" [ref=f1e417] [cursor=pointer]
              - link:
                - /url: //en.wikipedia.org/wiki/File:Schlossbergbahn.webm
