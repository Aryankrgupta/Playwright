              - paragraph [ref=f1e428]:
                - text: Native WebM support by
                - link "Mozilla Firefox" [ref=f1e429] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Firefox
                - text: ","
                - superscript [ref=f1e430]:
                  - link "[10]" [ref=f1e431] [cursor=pointer]:
                    - /url: "#cite_note-10"
                - superscript [ref=f1e432]:
                  - link "[11]" [ref=f1e433] [cursor=pointer]:
                    - /url: "#cite_note-11"
                - link "Opera" [ref=f1e434] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Opera_(web_browser)
                - text: ","
                - superscript [ref=f1e435]:
                  - link "[12]" [ref=f1e436] [cursor=pointer]:
                    - /url: "#cite_note-12"
                - superscript [ref=f1e437]:
                  - link "[13]" [ref=f1e438] [cursor=pointer]:
                    - /url: "#cite_note-13"
                - text: and
                - link "Google Chrome" [ref=f1e439] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Google_Chrome
                - superscript [ref=f1e440]:
                  - link "[14]" [ref=f1e441] [cursor=pointer]:
                    - /url: "#cite_note-14"
                - text: was announced at the 2010
                - link "Google I/O" [ref=f1e442] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Google_I/O
                - text: conference.
                - link "Internet Explorer 9" [ref=f1e443] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Internet_Explorer_9
                - text: requires third-party WebM software.
                - superscript [ref=f1e444]:
                  - link "[15]" [ref=f1e445] [cursor=pointer]:
                    - /url: "#cite_note-15"
                - text: In 2021,
                - link "Apple" [ref=f1e446] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Apple_Inc.
                - text: released
                - link "Safari" [ref=f1e447] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Safari_(web_browser)
                - text: 14.1 for macOS, which added native WebM support to the browser.
                - superscript [ref=f1e448]:
                  - link "[16]" [ref=f1e449] [cursor=pointer]:
                    - /url: "#cite_note-16"
                - text: As of 2019 , QuickTime does not natively support WebM,
                - superscript [ref=f1e450]:
                  - link "[17]" [ref=f1e451] [cursor=pointer]:
                    - /url: "#cite_note-17"
                - superscript [ref=f1e452]:
                  - link "[18]" [ref=f1e453] [cursor=pointer]:
                    - /url: "#cite_note-18"
                - text: but does with a suitable third-party plug-in.
                - superscript [ref=f1e454]:
                  - link "[19]" [ref=f1e455] [cursor=pointer]:
                    - /url: "#cite_note-19"
                - text: In 2011, the Google WebM Project Team released plugins for Internet Explorer and Safari to allow playback of WebM files through the standard HTML5
                - code [ref=f1e456]: <video>
                - text: tag.
                - superscript [ref=f1e457]:
                  - link "[20]" [ref=f1e458] [cursor=pointer]:
                    - /url: "#cite_note-googleplugin-20"
                - text: As of 9 June 2012 , Internet Explorer 9 and later supported the plugin for Windows Vista and later.
                - superscript [ref=f1e459]:
                  - link "[21]" [ref=f1e460] [cursor=pointer]:
                    - /url: "#cite_note-21"
              - paragraph [ref=f1e461]:
                - link "VLC media player" [ref=f1e462] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/VLC_media_player
                - text: ","
                - superscript [ref=f1e463]:
                  - link "[22]" [ref=f1e464] [cursor=pointer]:
                    - /url: "#cite_note-22"
                - link "MPlayer" [ref=f1e465] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/MPlayer
                - text: ","
                - link "K-Multimedia Player" [ref=f1e466] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/KMPlayer
                - text: and
                - link "JRiver Media Center" [ref=f1e467] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/JRiver_Media_Center
                - text: have native support for playing WebM files.
                - superscript [ref=f1e468]:
                  - link "[23]" [ref=f1e469] [cursor=pointer]:
                    - /url: "#cite_note-23"
                - link "FFmpeg" [ref=f1e470] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/FFmpeg
                - text: can encode and decode VP8 videos when built with support for
                - link "libvpx" [ref=f1e471] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Libvpx
                - text: ", the VP8/VP9 codec library of the WebM project, as well as"
                - link "mux" [ref=f1e472] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Multiplexing
                - text: /
                - link "demux" [ref=f1e473] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Demultiplexer_(media_file)
                - text: WebM-compliant files.
                - superscript [ref=f1e474]:
                  - link "[24]" [ref=f1e475] [cursor=pointer]:
                    - /url: "#cite_note-24"
                - text: On July 23, 2010 Fiona Glaser, Ronald Bultje, and David Conrad of the FFmpeg team announced the ffvp8 decoder. Their testing found that ffvp8 was faster than Google's own libvpx decoder.
                - superscript [ref=f1e476]:
                  - link "[25]" [ref=f1e477] [cursor=pointer]:
                    - /url: "#cite_note-ffvp8-25"
                - superscript [ref=f1e478]:
                  - link "[26]" [ref=f1e479] [cursor=pointer]:
                    - /url: "#cite_note-26"
                - link "MKVToolNix" [ref=f1e480] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/MKVToolNix
                - text: ", the popular"
                - link "Matroska" [ref=f1e481] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Matroska
                - text: creation tools, implemented support for multiplexing/demultiplexing WebM-compliant files out of the box.
                - superscript [ref=f1e482]:
                  - link "[27]" [ref=f1e483] [cursor=pointer]:
                    - /url: "#cite_note-matroska-tools-27"
                - text: Haali Media Splitter also announced support for muxing/demuxing of WebM.
                - superscript [ref=f1e484]:
                  - link "[27]" [ref=f1e485] [cursor=pointer]:
                    - /url: "#cite_note-matroska-tools-27"
                - text: Since version 1.4.9, the
                - link "LiVES" [ref=f1e486] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/LiVES
                - text: video editor has support for realtime decoding and for encoding to WebM format using ffmpeg libraries.
              - paragraph [ref=f1e487]:
                - link "MPC-HC" [ref=f1e488] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Media_Player_Classic_Home_Cinema
                - text: since build SVN 2071 supports WebM playback with internal VP8 decoder based on
                - link "FFmpeg" [ref=f1e489] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/FFmpeg
                - text: "'s code."
                - superscript [ref=f1e490]:
                  - link "[25]" [ref=f1e491] [cursor=pointer]:
                    - /url: "#cite_note-ffvp8-25"
                - superscript [ref=f1e492]:
                  - link "[28]" [ref=f1e493] [cursor=pointer]:
                    - /url: "#cite_note-MPC-HC-28"
                - text: The full decoding support for WebM is available in MPC-HC since version 1.4.2499.0.
                - superscript [ref=f1e494]:
                  - link "[29]" [ref=f1e495] [cursor=pointer]:
                    - /url: "#cite_note-29"
              - paragraph [ref=f1e496]:
                - link "Android" [ref=f1e497] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Android_(operating_system)
                - text: is WebM-enabled since version
                - link "2.3 Gingerbread" [ref=f1e498] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Android_Gingerbread
                - text: ","
                - superscript [ref=f1e499]:
                  - link "[30]" [ref=f1e500] [cursor=pointer]:
                    - /url: "#cite_note-30"
                - text: which was first made available via the
                - link "Nexus S" [ref=f1e501] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Nexus_S
                - text: smartphone and streamable since Android
                - link "4.0 Ice Cream Sandwich" [ref=f1e502] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Android_Ice_Cream_Sandwich
                - text: .
                - superscript [ref=f1e503]:
                  - link "[31]" [ref=f1e504] [cursor=pointer]:
                    - /url: "#cite_note-31"
              - paragraph [ref=f1e505]:
                - text: The Microsoft Edge browser supports WebM since April 2016.
                - superscript [ref=f1e506]:
                  - link "[32]" [ref=f1e507] [cursor=pointer]:
                    - /url: "#cite_note-32"
              - paragraph [ref=f1e508]:
                - text: On July 30, 2019,
                - link "Blender 2.80" [ref=f1e509] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Blender_(software)
                - text: was released with WebM support.
                - superscript [ref=f1e510]:
                  - link "[33]" [ref=f1e511] [cursor=pointer]:
                    - /url: "#cite_note-33"
              - paragraph [ref=f1e512]:
                - link "iOS" [ref=f1e513] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/IOS
                - text: did not natively play WebM until 2021,
                - superscript [ref=f1e514]:
                  - link "[34]" [ref=f1e515] [cursor=pointer]:
                    - /url: "#cite_note-34"
                - text: when support for WebM was added in Safari 15 as part of
                - link "iOS 15" [ref=f1e516] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/IOS_15
                - text: .
                - superscript [ref=f1e517]:
                  - link "[35]" [ref=f1e518] [cursor=pointer]:
                    - /url: "#cite_note-35"
              - paragraph [ref=f1e519]:
                - text: The Sony
                - link "PlayStation 5" [ref=f1e520] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/PlayStation_5
                - text: supports capturing 1080p and 2160p footage in WebM format.
                - superscript [ref=f1e521]:
                  - link "[36]" [ref=f1e522] [cursor=pointer]:
                    - /url: "#cite_note-36"
              - paragraph [ref=f1e523]:
                - link "ChromeOS" [ref=f1e524] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/ChromeOS
                - text: screen recordings are saved as WebM files.
                - superscript [ref=f1e525]:
                  - link "[37]" [ref=f1e526] [cursor=pointer]:
                    - /url: "#cite_note-37"
            - region [ref=f1e527]:
              - generic [ref=f1e528]:
                - heading "Hardware" [level=3] [ref=f1e529]
                - generic [ref=f1e530]:
                  - link "edit":
                    - /url: /w/index.php?title=WebM&action=edit&section=3
              - paragraph [ref=f1e531]:
                - text: WebM Project licenses VP8 hardware accelerators (
                - link "RTL IP" [ref=f1e532] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Semiconductor_intellectual_property_core
                - text: ) to semiconductor companies for 1080p encoding and decoding at zero cost.
                - superscript [ref=f1e533]:
                  - link "[38]" [ref=f1e534] [cursor=pointer]:
                    - /url: "#cite_note-38"
                - link "AMD" [ref=f1e535] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Advanced_Micro_Devices
                - text: ","
                - link "ARM" [ref=f1e536] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/ARM_Holdings
                - text: and
                - link "Broadcom" [ref=f1e537] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Broadcom
                - text: have announced support for
                - link "hardware acceleration" [ref=f1e538] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Hardware_acceleration
                - text: of the WebM format.
                - superscript [ref=f1e539]:
                  - link "[39]" [ref=f1e540] [cursor=pointer]:
                    - /url: "#cite_note-39"
                - superscript [ref=f1e541]:
                  - link "[40]" [ref=f1e542] [cursor=pointer]:
                    - /url: "#cite_note-40"
                - link "Intel" [ref=f1e543] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Intel
                - text: is also considering hardware-based acceleration for WebM in its
                - link "Atom-based" [ref=f1e544] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Intel_Atom
                - text: TV chips if the format gains popularity.
                - superscript [ref=f1e545]:
                  - link "[41]" [ref=f1e546] [cursor=pointer]:
                    - /url: "#cite_note-41"
                - link "Qualcomm" [ref=f1e547] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Qualcomm
                - text: and
                - link "Texas Instruments" [ref=f1e548] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Texas_Instruments
                - text: have announced support,
                - superscript [ref=f1e549]:
                  - link "[42]" [ref=f1e550] [cursor=pointer]:
                    - /url: "#cite_note-42"
                - superscript [ref=f1e551]:
                  - link "[43]" [ref=f1e552] [cursor=pointer]:
                    - /url: "#cite_note-43"
                - text: with native support coming to the TI
                - link "OMAP" [ref=f1e553] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/OMAP
                - text: processor.
                - superscript [ref=f1e554]:
                  - link "[44]" [ref=f1e555] [cursor=pointer]:
                    - /url: "#cite_note-44"
                - link "Chips&Media" [ref=f1e556] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Chips&Media
                - text: have announced a fully hardware decoder for VP8 that can decode
                - link "full HD" [ref=f1e557] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/1080p
                - text: resolution (1080p) VP8 streams at 60 frames per second.
                - superscript [ref=f1e558]:
                  - link "[45]" [ref=f1e559] [cursor=pointer]:
                    - /url: "#cite_note-45"
              - paragraph [ref=f1e560]:
                - link "Nvidia" [ref=f1e561] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Nvidia
                - text: is supporting VP8 and provides both hardware decoding and encoding in the
                - link "Tegra 4" [ref=f1e562] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Tegra#Tegra_4
                - text: and
                - link "Tegra 4i" [ref=f1e563] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Tegra#Tegra_4i
                - link "SoCs" [ref=f1e564] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/System_on_a_chip
                - text: .
                - superscript [ref=f1e565]:
                  - link "[46]" [ref=f1e566] [cursor=pointer]:
                    - /url: "#cite_note-46"
                - link "Nvidia" [ref=f1e567] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Nvidia
                - text: announced
                - link "3D" [ref=f1e568] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Stereoscopy
                - text: video support for WebM through
                - link "HTML5" [ref=f1e569] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/HTML5
                - text: and their
                - link "Nvidia 3D Vision" [ref=f1e570] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Nvidia_3D_Vision
                - text: technology.
                - superscript [ref=f1e571]:
                  - link "[47]" [ref=f1e572] [cursor=pointer]:
                    - /url: "#cite_note-47"
                - superscript [ref=f1e573]:
                  - link "[48]" [ref=f1e574] [cursor=pointer]:
                    - /url: "#cite_note-48"
                - superscript [ref=f1e575]:
                  - link "[49]" [ref=f1e576] [cursor=pointer]:
                    - /url: "#cite_note-49"
              - paragraph [ref=f1e577]:
                - text: On January 7, 2011,
                - link "Rockchip" [ref=f1e578] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Rockchip
                - text: released the world's first chip to host a full hardware implementation of 1080p VP8 decoding. The video acceleration in the RK29xx chip is handled by the WebM Project's G-Series 1 hardware decoder IP.
                - superscript [ref=f1e579]:
                  - link "[50]" [ref=f1e580] [cursor=pointer]:
                    - /url: "#cite_note-50"
              - paragraph [ref=f1e581]:
                - text: In June 2011,
                - link "ZiiLABS" [ref=f1e582] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/ZiiLABS
                - text: demonstrated their 1080p VP8 decoder implementation running on the ZMS-20 processor. The chip's programmable media processing array is used to provide the VP8 acceleration.
                - superscript [ref=f1e583]:
                  - link "[51]" [ref=f1e584] [cursor=pointer]:
                    - /url: "#cite_note-51"
              - paragraph [ref=f1e585]:
                - link "ST-Ericsson" [ref=f1e586] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/ST-Ericsson
                - text: and
                - link "Huawei" [ref=f1e587] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Huawei
                - text: also had hardware implementations in their computer chips.
                - superscript [ref=f1e588]:
                  - link "[52]" [ref=f1e589] [cursor=pointer]:
                    - /url: "#cite_note-52"
            - region [ref=f1e590]:
              - generic [ref=f1e591]:
                - heading "Streaming capabilities" [level=3] [ref=f1e592]
                - generic [ref=f1e593]:
                  - link "edit":
                    - /url: /w/index.php?title=WebM&action=edit&section=4
              - paragraph [ref=f1e594]:
                - text: Since 2017,
                - link "Icecast" [ref=f1e595] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Icecast
                - text: — a streaming media server traditionally used for audio streaming — has supported live video streaming using the WebM format (VP8/VP9/AV1 video codecs with Vorbis/Opus audio codecs).
                - superscript [ref=f1e596]:
                  - link "[53]" [ref=f1e597] [cursor=pointer]:
                    - /url: "#cite_note-53"
                - text: This enables broadcasting of high-quality, royalty-free, open-standard video streams that can be played directly in browsers without requiring proprietary plugins or players.
              - paragraph [ref=f1e598]:
                - text: Archived streams and server listings demonstrate WebM's viability for live streaming over Icecast, including examples of 1080p VP9 streams. Current implementations include live streams accessible at
                - link "https://rdst.win:59000/dos.webm" [ref=f1e599] [cursor=pointer]:
                  - /url: https://rdst.win:59000/dos.webm
                - text: ","
                - superscript [ref=f1e600]:
                  - link "[54]" [ref=f1e601] [cursor=pointer]:
                    - /url: "#cite_note-54"
                - text: with server status visible at
                - link "https://rdst.win:59000" [ref=f1e602] [cursor=pointer]:
                  - /url: https://rdst.win:59000
                - text: .
          - region [ref=f1e603]:
            - generic [ref=f1e604]:
              - heading "Streaming examples and resources" [level=2] [ref=f1e605]
              - generic [ref=f1e606]:
                - link "edit":
                  - /url: /w/index.php?title=WebM&action=edit&section=5
            - list [ref=f1e607]:
              - listitem [ref=f1e608]:
                - link "webm.win" [ref=f1e609] [cursor=pointer]:
                  - /url: https://webm.win
                - text: — Demonstrates a live WebM stream via Icecast (VP9 video with Vorbis audio, playable in browsers using the HTML5 <video> element) and provides instructions for setting up similar broadcasting. (accessed 27 September 2025)
              - listitem [ref=f1e610]:
                - link "Archived Icecast directory with WebM streams (June 2017)" [ref=f1e611] [cursor=pointer]:
                  - /url: https://web.archive.org/web/20170606103556/http://dir.xiph.org/by_format/WebM
              - listitem [ref=f1e612]:
                - link "Archived WebM stream example (2017)" [ref=f1e613] [cursor=pointer]:
                  - /url: https://web.archive.org/web/20170626062807/http://stgr.info:9554/dos.webm
          - region [ref=f1e614]:
            - generic [ref=f1e615]:
              - heading "Licensing" [level=2] [ref=f1e616]
              - generic [ref=f1e617]:
                - link "edit":
                  - /url: /w/index.php?title=WebM&action=edit&section=6
            - paragraph [ref=f1e618]:
              - text: The original WebM license terminated both patent grants and copyright redistribution terms if a patent infringement lawsuit was filed, causing concerns around GPL compatibility. In response to those concerns, the WebM Project decoupled the patent grant from the copyright grant, offering the code under a standard
              - link "BSD license" [ref=f1e619] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/BSD_license
              - text: and patents under a separate grant.
              - superscript [ref=f1e620]:
                - link "[55]" [ref=f1e621] [cursor=pointer]:
                  - /url: "#cite_note-55"
              - text: The
              - link "Free Software Foundation" [ref=f1e622] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Free_Software_Foundation
              - text: ", which maintains"
              - link "The Free Software Definition" [ref=f1e623] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/The_Free_Software_Definition
              - text: ", has given its endorsement for WebM and VP8"
              - superscript [ref=f1e624]:
                - link "[56]" [ref=f1e625] [cursor=pointer]:
                  - /url: "#cite_note-fsf-56"
              - text: and considers the software's license to be compatible with the
              - link "GNU General Public License" [ref=f1e626] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/GNU_General_Public_License
              - text: .
              - superscript [ref=f1e627]:
                - link "[57]" [ref=f1e628] [cursor=pointer]:
                  - /url: "#cite_note-57"
              - superscript [ref=f1e629]:
                - link "[58]" [ref=f1e630] [cursor=pointer]:
                  - /url: "#cite_note-gnu-58"
              - text: On January 19, 2011, the Free Software Foundation announced its official support for the WebM project.
              - superscript [ref=f1e631]:
                - link "[59]" [ref=f1e632] [cursor=pointer]:
                  - /url: "#cite_note-59"
              - text: In February 2011,
              - link "Microsoft" [ref=f1e633] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Microsoft
              - text: "'s Vice President of Internet Explorer called upon Google to provide indemnification against patent suits."
              - superscript [ref=f1e634]:
                - link "[60]" [ref=f1e635] [cursor=pointer]:
                  - /url: "#cite_note-60"
            - paragraph [ref=f1e636]:
              - text: Although Google has irrevocably released all of its patents on VP8 as a royalty-free format,
              - superscript [ref=f1e637]:
                - link "[61]" [ref=f1e638] [cursor=pointer]:
                  - /url: "#cite_note-61"
              - text: the
              - link "MPEG LA" [ref=f1e639] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/MPEG_LA
              - text: ", licensors of the"
              - link "H.264" [ref=f1e640] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/H.264/MPEG-4_AVC
              - text: patent pool, have expressed interest in creating a
              - link "patent pool" [ref=f1e641] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Patent_pool
              - text: for VP8.
              - superscript [ref=f1e642]:
                - link "[62]" [ref=f1e643] [cursor=pointer]:
                  - /url: "#cite_note-62"
              - superscript [ref=f1e644]:
                - link "[63]" [ref=f1e645] [cursor=pointer]:
                  - /url: "#cite_note-63"
              - text: Conversely, other researchers cite evidence that
              - link "On2" [ref=f1e646] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/On2
              - text: made a particular effort to avoid any MPEG LA patents.
              - superscript [ref=f1e647]:
                - link "[64]" [ref=f1e648] [cursor=pointer]:
                  - /url: "#cite_note-64"
              - text: As a result of the threat, the
              - link "United States Department of Justice" [ref=f1e649] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/United_States_Department_of_Justice
              - text: (DOJ) started an investigation in March 2011 into the MPEG LA for its role in possibly attempting to stifle competition.
              - superscript [ref=f1e650]:
                - link "[65]" [ref=f1e651] [cursor=pointer]:
                  - /url: "#cite_note-65"
              - superscript [ref=f1e652]:
                - link "[66]" [ref=f1e653] [cursor=pointer]:
                  - /url: "#cite_note-66"
              - text: In March 2013, MPEG LA announced that it had reached an agreement with Google to license patents that "may be essential" for the implementation of the VP8 codec, and give Google the right to sub-license these patents to any third-party user of VP8 or
              - link "VP9" [ref=f1e654] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/VP9
              - text: .
              - superscript [ref=f1e655]:
                - link "[67]" [ref=f1e656] [cursor=pointer]:
                  - /url: "#cite_note-theh-agreement-67"
              - superscript [ref=f1e657]:
                - link "[68]" [ref=f1e658] [cursor=pointer]:
                  - /url: "#cite_note-68"
            - paragraph [ref=f1e659]:
              - text: In March 2013,
              - link "Nokia" [ref=f1e660] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Nokia
              - text: filed an objection to the
              - link "Internet Engineering Task Force" [ref=f1e661] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Internet_Engineering_Task_Force
              - text: concerning Google's proposal for the VP8 codec to be a core part of WebM, saying it holds essential patents to VP8's implementation.
              - superscript [ref=f1e662]:
                - link "[69]" [ref=f1e663] [cursor=pointer]:
                  - /url: "#cite_note-69"
              - text: Nokia listed 64 patents and 22 pending applications, adding it was not prepared to license any of them for VP8.
              - superscript [ref=f1e664]:
                - link "[70]" [ref=f1e665] [cursor=pointer]:
                  - /url: "#cite_note-70"
              - text: On August 5, 2013, a court in Mannheim, Germany, ruled that VP8 does not infringe a patent owned and asserted by Nokia.
              - superscript [ref=f1e666]:
                - link "[71]" [ref=f1e667] [cursor=pointer]:
                  - /url: "#cite_note-71"
